<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chez nous</title>
<meta name="theme-color" content="#F7FAF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1A15" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chez nous">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* =====================================================================
   CHEZ NOUS — styles
   Concept : coque iOS (barre d'onglets en bas, feuilles modales, verre dépoli)
   Palette : vert sauge #7FB89A · menthe #A8D5BA · vert profond #2F5D4A
   ===================================================================== */
:root{
  --bg:#E7F1EA; --bg-hi:#F4F9F6; --card:#FFFFFF; --soft:#EAF4EE; --line:rgba(47,93,74,.11); --line-2:rgba(47,93,74,.2);
  --ink:#16261E; --ink2:#5C7068; --ink3:#93A39A;
  --sage:#7FB89A; --mint:#A8D5BA; --deep:#2F5D4A; --accent-ink:#2F5D4A; --on-sage:#12301F;
  --today:#2F5D4A; --on-today:#FFFFFF;
  --maxym:#2F7D5B; --on-maxym:#FFFFFF; --sasha:#9CCB7C; --on-sasha:#1E3A22;
  --warn:#F0B27A; --bad:#E58C8C; --bad-ink:#A04545;
  --glass:rgba(231,241,234,.84); --sheet:rgba(255,255,255,.9); --backdrop:rgba(18,32,26,.4);
  --toast-bg:rgba(31,61,48,.95); --toast-ink:#FFFFFF;
  --shadow:0 1px 1px rgba(28,58,45,.04),0 10px 30px rgba(28,58,45,.08);
  --shadow-up:0 -12px 44px rgba(20,45,35,.2);
  --rc:24px; --tabh:62px; --ease:cubic-bezier(.22,.8,.24,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
}
:root[data-bg="blanc"]{--bg:#F5F7F6;--bg-hi:#FFFFFF;--glass:rgba(245,247,246,.82)}
:root[data-bg="menthe"]{--bg:#E7F1EA;--bg-hi:#F4F9F6;--glass:rgba(231,241,234,.84)}
:root[data-bg="sauge"]{--bg:#CBE4D5;--bg-hi:#DDEFE4;--glass:rgba(208,230,218,.82)}
:root[data-bg="creme"]{--bg:#F3EFE5;--bg-hi:#FBF8F1;--glass:rgba(243,239,229,.84)}
:root[data-bg="ardoise"]{--bg:#E8EDF1;--bg-hi:#F5F8FA;--glass:rgba(232,237,241,.84)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A15; --bg-hi:#17291F; --card:#1A2A23; --soft:#22372D; --line:rgba(168,213,186,.1); --line-2:rgba(168,213,186,.2);
  --ink:#EAF3EE; --ink2:#9DB2A7; --ink3:#6F867A; --accent-ink:#A8D5BA; --today:#A8D5BA; --on-today:#0F1A15;
  --maxym:#4FB588; --on-maxym:#07210F; --sasha:#B6DC98; --on-sasha:#18301B; --bad-ink:#F0A5A5;
  --glass:rgba(15,26,21,.78); --sheet:rgba(26,42,35,.92); --backdrop:rgba(0,0,0,.55);
  --toast-bg:rgba(234,243,238,.96); --toast-ink:#0F1A15;
  --shadow:0 1px 1px rgba(0,0,0,.2),0 10px 30px rgba(0,0,0,.28); --shadow-up:0 -12px 44px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A15; --bg-hi:#17291F; --card:#1A2A23; --soft:#22372D; --line:rgba(168,213,186,.1); --line-2:rgba(168,213,186,.2);
  --ink:#EAF3EE; --ink2:#9DB2A7; --ink3:#6F867A; --accent-ink:#A8D5BA; --today:#A8D5BA; --on-today:#0F1A15;
  --maxym:#4FB588; --on-maxym:#07210F; --sasha:#B6DC98; --on-sasha:#18301B; --bad-ink:#F0A5A5;
  --glass:rgba(15,26,21,.78); --sheet:rgba(26,42,35,.92); --backdrop:rgba(0,0,0,.55);
  --toast-bg:rgba(234,243,238,.96); --toast-ink:#0F1A15;
  --shadow:0 1px 1px rgba(0,0,0,.2),0 10px 30px rgba(0,0,0,.28); --shadow-up:0 -12px 44px rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--bg-hi) 0,var(--bg) 380px),var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:active:not(:disabled){transform:scale(.97)}
button,.ib,.chip,.btn{transition:transform .12s var(--ease),background .2s,box-shadow .2s,opacity .2s}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--sage) 70%,transparent);outline-offset:2px;border-radius:12px}
h1,h2,h3,p{margin:0}
.i{display:block;flex:none}
[hidden]{display:none!important}

/* ---------- coque ---------- */
#app{height:100%;display:flex;flex-direction:column;position:relative}
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.page{width:100%;max-width:880px;margin:0 auto;padding:0 16px calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 104px)}
.hdr{position:sticky;top:0;z-index:6;margin:0 -16px;padding:14px 16px 10px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5)}
.hrow{display:flex;align-items:center;gap:10px}
.title{font-size:31px;font-weight:800;letter-spacing:-.025em;line-height:1.1;flex:1;min-width:0;text-wrap:balance}
.sub{color:var(--ink2);font-size:14px;margin-top:2px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);color:var(--accent-ink);flex:none}
.ib.flat{background:transparent;box-shadow:none}
.me-btn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;position:relative}
.me-btn .sd{position:absolute;right:2px;bottom:2px;width:11px;height:11px;border-radius:50%;background:var(--mint);border:2px solid var(--bg)}
.me-btn .sd.off{background:var(--warn)}
.content{padding-top:6px}
.navrow{display:flex;align-items:center;gap:8px;margin-top:10px}
.navt{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;line-height:1.15}
.navt b{font-size:19px;font-weight:700;letter-spacing:-.01em}
.navt span{font-size:13px;color:var(--ink2)}
.hdr .seg{margin-top:10px}

#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border-radius:16px;color:var(--ink3);font-size:11px;font-weight:600}
.tab.on{color:var(--accent-ink)}
.tab.on .tic{background:color-mix(in srgb,var(--sage) 30%,transparent)}
.tic{width:54px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .25s}
.tic svg{width:24px;height:24px}
.brand{display:none}

#fab{position:fixed;right:18px;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 16px);width:58px;height:58px;border-radius:50%;background:var(--sage);color:var(--on-sage);box-shadow:0 10px 26px rgba(47,93,74,.38);display:grid;place-items:center;z-index:20;transition:transform .22s var(--ease),opacity .2s}
#fab.hide{transform:scale(.5);opacity:0;pointer-events:none}
#fab svg{width:28px;height:28px;stroke-width:2.2}

@media (min-width:920px){
  #app{flex-direction:row}
  #tabbar{position:static;display:flex;flex-direction:column;gap:6px;width:236px;flex:none;height:100%;padding:30px 14px;border-top:0;border-right:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;letter-spacing:-.02em;padding:0 12px 22px;color:var(--accent-ink)}
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;min-height:48px;padding:0 12px;font-size:16px}
  .tab.on{background:color-mix(in srgb,var(--sage) 26%,transparent)}
  .tab.on .tic{background:transparent}
  .tic{width:28px;height:28px}
  .page{padding-bottom:120px}
  #fab{right:36px;bottom:36px}
}

/* ---------- briques ---------- */
.card{background:var(--card);border-radius:var(--rc);box-shadow:var(--shadow);padding:18px;margin-top:14px}
.card.tint{background:var(--soft);box-shadow:none}
.card h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.card h3 button.lk{text-transform:none;letter-spacing:0;font-size:14px;color:var(--accent-ink);font-weight:600;min-height:32px}
.grid2{display:grid;gap:0 14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.mut{color:var(--ink2)}
.sm{font-size:13px}
.amount{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.big{font-size:34px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.1}
.av{width:var(--s,28px);height:var(--s,28px);border-radius:50%;background:var(--c);color:var(--o);display:inline-grid;place-items:center;font-weight:800;font-size:calc(var(--s,28px) * .45);flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:13px;background:var(--soft);color:var(--accent-ink);font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.warn{background:color-mix(in srgb,var(--warn) 30%,var(--card));color:#8A5420}
.pill.bad{background:color-mix(in srgb,var(--bad) 28%,var(--card));color:var(--bad-ink)}
.pill.ok{background:color-mix(in srgb,var(--mint) 45%,var(--card))}
.btn{min-height:50px;border-radius:16px;padding:0 20px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn-p{background:var(--sage);color:var(--on-sage)}
.btn-s{background:var(--soft);color:var(--accent-ink)}
.btn-d{background:color-mix(in srgb,var(--bad) 22%,var(--card));color:var(--bad-ink)}
.btn-g{color:var(--accent-ink);min-height:44px}
.btn-b{width:100%}
.btn-sm{min-height:44px;padding:0 16px;font-size:15px;border-radius:14px}
.btns{display:grid;gap:10px;margin-top:20px}
.btns.two{grid-template-columns:1fr 1fr}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:22px;background:var(--soft);font-weight:600;font-size:15px;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--sage);color:var(--on-sage)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.seg{display:flex;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:13px;padding:3px;gap:2px}
.seg button{flex:1;min-height:42px;border-radius:10px;font-size:14.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;min-width:0;padding:0 6px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.13)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:18px 0 8px}
.inp{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--card);padding:0 14px;font-size:16px;appearance:none;-webkit-appearance:none}
textarea.inp{padding:12px 14px;min-height:84px;resize:vertical}
.inp:focus{outline:0;border-color:var(--sage);box-shadow:0 0 0 4px color-mix(in srgb,var(--sage) 25%,transparent)}
.amt{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:8px 0 2px}
.amt input{font-size:46px;font-weight:800;letter-spacing:-.025em;text-align:center;border:0;background:transparent;width:70%;min-width:0;padding:0;font-variant-numeric:tabular-nums}
.amt input:focus{outline:0}
.amt span{font-size:30px;font-weight:700;color:var(--ink3)}
.swr{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;font-weight:600}
.sw{width:51px;height:31px;border-radius:16px;background:var(--line-2);position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .25s var(--ease)}
.sw.on{background:var(--sage)}
.sw.on::after{transform:translateX(20px)}
.li{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 0;border-top:1px solid var(--line);width:100%}
.li:first-child{border-top:0}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:color-mix(in srgb,var(--pc,var(--sage)) 26%,var(--card));flex:none}
.ic.sm{width:34px;height:34px;border-radius:11px;font-size:17px}
.empty{text-align:center;padding:26px 12px;color:var(--ink2)}
.empty .eic{width:64px;height:64px;border-radius:22px;background:var(--soft);display:grid;place-items:center;margin:0 auto 12px;color:var(--accent-ink)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--warn) 24%,var(--card));font-size:14px;margin-top:14px}
.note.info{background:var(--soft)}
.note .grow b{display:block}
.sk{background:linear-gradient(90deg,var(--soft),color-mix(in srgb,var(--soft) 45%,var(--card)),var(--soft));background-size:200% 100%;animation:shimmer 1.3s linear infinite;border-radius:20px}
@keyframes shimmer{to{background-position:-200% 0}}

/* ---------- feuilles modales ---------- */
#sheetRoot{position:fixed;inset:0;z-index:50;display:none}
#sheetRoot.open{display:block}
.backdrop{position:absolute;inset:0;background:var(--backdrop);opacity:0;transition:opacity .3s var(--ease);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#sheetRoot.show .backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;display:flex;flex-direction:column;background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);border-radius:28px 28px 0 0;box-shadow:var(--shadow-up);transform:translateY(100%);transition:transform .34s var(--ease)}
#sheetRoot.show .sheet{transform:none}
.sheet.drag{transition:none}
.grab{height:30px;display:grid;place-items:center;flex:none;touch-action:none}
.grab i{width:40px;height:5px;border-radius:3px;background:var(--line-2)}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:0 20px calc(24px + env(safe-area-inset-bottom,0px))}
.st{font-size:23px;font-weight:800;letter-spacing:-.015em;text-wrap:balance}
.ss{color:var(--ink2);font-size:14px;margin-top:2px}
@media (min-width:760px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(540px,92vw);max-height:88%;border-radius:28px;transform:translate(-50%,-46%) scale(.96);opacity:0;transition:transform .3s var(--ease),opacity .25s}
  #sheetRoot.show .sheet{transform:translate(-50%,-50%);opacity:1}
  .grab{height:18px}
}

/* ---------- toasts ---------- */
#toastRoot{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 82px);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none;padding:0 16px}
.toast{display:flex;align-items:center;gap:9px;max-width:min(440px,100%);padding:12px 18px;border-radius:22px;background:var(--toast-bg);color:var(--toast-ink);font-size:15px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:fade .32s var(--ease)}
.toast.err{background:#B24A4A;color:#fff}
.toast.out{opacity:0;transform:translateY(8px);transition:all .28s}
.toast svg{width:20px;height:20px;stroke:var(--mint);stroke-width:3;fill:none;stroke-dasharray:26;stroke-dashoffset:26;animation:draw .45s .1s forwards;flex:none}
@keyframes draw{to{stroke-dashoffset:0}}
@media (min-width:920px){#toastRoot{bottom:32px}}

/* ---------- profil au premier lancement ---------- */
#gate{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;overflow-y:auto}
#gate.on{display:block}
.gate{max-width:420px;margin:0 auto;padding:max(8vh,40px) 24px 40px;text-align:center}
.gate-logo{width:72px;height:72px;border-radius:24px;background:var(--sage);color:var(--on-sage);display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 14px 34px rgba(47,93,74,.3)}
.gate h1{font-size:36px;font-weight:800;letter-spacing:-.03em}
.gate p{color:var(--ink2);margin-top:6px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.whoc{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:22px 10px;display:flex;flex-direction:column;align-items:center;gap:12px;font-size:19px;font-weight:700;min-height:160px;justify-content:center}
.fine{font-size:13px;margin-top:22px}

/* ---------- accueil ---------- */
.tdp{display:grid;grid-template-columns:34px repeat(3,minmax(0,1fr));gap:6px;align-items:center;margin-top:8px}
.tc{border-radius:14px;padding:7px 4px;text-align:center;font-size:11.5px;color:var(--ink2);font-weight:600;background:color-mix(in srgb,var(--pc,var(--ink3)) 22%,var(--card));min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.15}
.tc b{font-size:19px;font-weight:400}
.tc.tg{box-shadow:inset 0 0 0 2px var(--mint)}
.tc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.meals2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.m2{background:var(--soft);border-radius:14px;padding:10px 12px;min-width:0}
.m2 small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.m2 b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.sd1{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 2px;border-radius:14px;min-height:76px;font-size:12px;color:var(--ink2);font-weight:700}
.sd1 b{font-size:15px;color:var(--ink);width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.sd1.today b{background:var(--today);color:var(--on-today)}
.sd1.we{background:color-mix(in srgb,var(--soft) 80%,transparent)}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.qa button{background:var(--card);border-radius:20px;box-shadow:var(--shadow);min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px;color:var(--accent-ink);text-align:center;padding:8px 4px}
.qa .qi{width:34px;height:34px;border-radius:12px;background:var(--soft);display:grid;place-items:center}
.sync-note{font-size:13px;color:var(--ink2);text-align:center;margin-top:18px}

/* ---------- planning ---------- */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.mh{text-align:center;font-size:12px;font-weight:700;color:var(--ink3);padding:6px 0}
.mc{min-height:66px;border-radius:14px;background:var(--card);padding:6px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 1px 2px rgba(28,58,45,.06);position:relative}

/* ---------- 9. Planning de présence : Mois > Semaine > Jour ---------- */
/* ---- Sélection de plusieurs jours (comme l'app Calendrier) ----
   Un ensemble de dates : touche pour (dé)sélectionner, glisse pour peindre, appui long pour démarrer.
   Touche un numéro de semaine (S41) ou une lettre (L, M…) pour tout choisir d'un coup. Persiste d'un mois / d'une semaine à l'autre. */
const SEL = { on: false, set: new Set() };
const selDays = () => [...SEL.set].sort();
const selCls = d => SEL.on && SEL.set.has(d) ? ' sel' : '';
const selReset = () => { SEL.on = false; SEL.set.clear(); };
const selBtn = () => `<button class="chip${SEL.on ? ' on' : ''}" data-act="sel-toggle">${SEL.on ? 'Terminer' : ico('check', 16, 2.6) + 'Sélectionner'}</button>`;
function selSummary() {
  const r = selDays(), n = r.length; if (!n) return 'Touche ou fais glisser';
  const f = d => fmtD(d, { weekday: 'short', day: 'numeric', month: 'short' });
  if (diffDays(r[0], r[n - 1]) === n - 1) return n === 1 ? f(r[0]) : f(r[0]) + ' → ' + f(r[n - 1]);
  const wk = new Set(r.map(d => monday(d))).size; return 'sur ' + wk + ' semaine' + (wk > 1 ? 's' : '');
}
function selCard() {
  if (!SEL.on) return '';
  const wk = A.plan.level === 'week';
  return `<div class="card selcard"><div class="sm" style="font-weight:600">${wk ? 'Touche les jours. Les flèches changent de semaine sans perdre ta sélection.' : 'Touche ou fais glisser. Touche un numéro de semaine ou une lettre pour tout choisir.'}</div>
    <div class="chips" style="margin-top:8px">${wk ? `<button class="chip" data-act="sel-weekview">Toute la semaine</button>` : `<button class="chip" data-act="sel-month">Tout le mois</button>`}<button class="chip" data-act="sel-expand">Semaines entières</button><button class="chip" data-act="sel-clear">Effacer</button></div></div>`;
}
function selBarHtml() {
  const n = SEL.set.size;
  return `<div class="selbar-in"><button class="btn btn-g" data-act="sel-cancel">Annuler</button><div class="selbar-t"><b>${n ? n + ' jour' + (n > 1 ? 's' : '') : 'Aucun jour'}</b><span>${esc(selSummary())}</span></div><button class="btn btn-p" data-act="sel-open"${n ? '' : ' disabled'}>Définir</button></div>`;
}
function renderSelBar() {
  const el = document.getElementById('selbar'); if (!el) return;
  if (SEL.on && A.tab !== 'plan') selReset();
  document.body.classList.toggle('selmode', SEL.on);
  el.classList.toggle('on', SEL.on); el.innerHTML = SEL.on ? selBarHtml() : '';
}
function selPaint(d, on) {
  if (on) SEL.set.add(d); else SEL.set.delete(d);
  document.querySelectorAll('[data-d="' + d + '"].mc, [data-d="' + d + '"].dh').forEach(x => x.classList.toggle('sel', on));
  renderSelBar();
}
const selCells = '.mc[data-d],.dh[data-d]';
let DRAG = null, LP = null, LPS = false;
document.addEventListener('pointerdown', e => {
  const c = e.target.closest && e.target.closest(selCells); if (!c || (e.button && e.button > 0)) return;
  const d = c.dataset.d;
  if (SEL.on) { DRAG = { on: !SEL.set.has(d), last: d }; selPaint(d, DRAG.on); return; }
  if (A.tab === 'plan' && A.plan.level !== 'day' && !SH) {
    LP = { x: e.clientX, y: e.clientY, d, t: setTimeout(() => { if (!LP) return; LP.fired = true; LPS = true; setTimeout(() => { LPS = false; }, 700); SEL.on = true; SEL.set.add(d); if (navigator.vibrate) { try { navigator.vibrate(10); } catch (er) { /* */ } } schedule(); }, 420) };
  }
});
document.addEventListener('pointermove', e => {
  if (DRAG) {
    const el = document.elementFromPoint(e.clientX, e.clientY), c = el && el.closest && el.closest(selCells);
    if (c && c.dataset.d !== DRAG.last) { const a = DRAG.last, b = c.dataset.d, lo = a < b ? a : b, hi = a < b ? b : a; for (let x = lo, i = 0; x <= hi && i < 120; x = addDays(x, 1), i++) selPaint(x, DRAG.on); DRAG.last = b; }
  } else if (LP && !LP.fired && Math.hypot(e.clientX - LP.x, e.clientY - LP.y) > 10) { clearTimeout(LP.t); LP = null; }
});
const endPtr = () => { if (DRAG) { DRAG = null; schedule(); } if (LP) { clearTimeout(LP.t); LP = null; } };
document.addEventListener('pointerup', endPtr); document.addEventListener('pointercancel', endPtr);
document.addEventListener('click', e => {
  if (LPS) { LPS = false; e.stopPropagation(); e.preventDefault(); return; }
  if (!SEL.on || e.detail !== 0) return;               // clic clavier (Entrée / Espace) : le pointeur gère déjà souris et doigt
  const c = e.target.closest && e.target.closest(selCells); if (c) { selPaint(c.dataset.d, !SEL.set.has(c.dataset.d)); schedule(); }
}, true);
const slotLbl = k => SLOTS.find(s => s.k === k).l;
function vPlan() { const l = A.plan.level; return l === 'month' ? planMonth() : l === 'week' ? planWeek() : planDay(); }
const levelSeg = () => `<div class="seg">${[['month', 'Mois'], ['week', 'Semaine'], ['day', 'Jour']].map(([k, l]) => `<button class="${A.plan.level === k ? 'on' : ''}" data-act="plan-level" data-v="${k}">${l}</button>`).join('')}</div>`;
const todayChip = `<button class="chip" data-act="plan-today">Aujourd’hui</button>`;
const legendH = () => `<div class="legend">${cfg().places.map(p => `<span style="--pc:${esc(p.color)}"><i></i>${esc(p.icon)} ${esc(p.label)}</span>`).join('')}</div>`;

function slotBtn(p, d, k) {
  const pl = placeById(slotPlace(p, d, k)), rec = isRec(p, d, k), tg = together(d, k);
  return `<button class="sl${pl ? '' : ' empty'}${tg ? ' tg' : ''}"${pl ? ` style="--pc:${esc(pl.color)}"` : ''} data-act="slot" data-p="${p}" data-d="${d}" data-s="${k}" aria-label="${esc(NAMES[p] + ', ' + dayLong(d) + ', ' + slotLbl(k) + ' : ' + (pl ? pl.label : 'non renseigné'))}">${pl ? esc(pl.icon) : '+'}${rec ? `<span class="rp">${ico('repeat', 11, 2.4)}</span>` : ''}</button>`;

/* --- vue Mois --- */
function planMonth() {
  const m = A.plan.month, t = today(), first = m + '-01', start = addDays(first, -wdi(first)), rows = Math.ceil((wdi(first) + dim(m)) / 7), sm = SEL.on;
  let cells = '';
  for (let i = 0; i < rows * 7; i++) {
    const d = addDays(start, i), inM = ymOf(d) === m;
    if (sm && i % 7 === 0) cells += `<button class="mw" data-act="sel-week" data-d="${d}" aria-label="Semaine ${isoWeek(d)}">${isoWeek(d)}</button>`;
    cells += `<button class="mc${inM ? '' : ' out'}${wdi(d) >= 5 ? ' we' : ''}${d === t ? ' today' : ''}${togetherCount(d) ? ' tg' : ''}${selCls(d)}"${sm ? '' : ' data-act="plan-week-of"'} data-d="${d}" aria-label="${esc(dayLong(d))}"><span class="n">${pd(d).getDate()}</span>${miniRows(d)}<span class="dots">${dotsFor(eventsOn(d))}</span></button>`;
  }
  const mhead = sm ? `<div class="mh"></div>` + DAYL.map((l, i) => `<button class="mh" data-act="sel-wd" data-i="${i}">${l}</button>`).join('') : DAYL.map(l => `<div class="mh">${l}</div>`).join('');
  return `<div class="page wide">${hdr('Planning', '', { right: todayChip, extra: `<div class="lvrow">${levelSeg()}${selBtn()}</div>` + navRow('plan-prev', 'plan-next', monthLabel(m)) })}<div class="content">${selCard()}
    <div class="card" style="padding:12px 10px"><div class="month${sm ? ' selm' : ''}">${mhead}${cells}</div></div>
    <div class="legend"><span>${av('maxym', 18)}en haut</span><span>${av('sasha', 18)}en bas</span><span>trois segments : matin, après-midi, soir</span><span><i style="--pc:var(--mint);border-radius:50%"></i>cadre vert : ensemble à la maison</span></div>
    ${legendH()}<p class="mut sm" style="margin-top:14px">${SEL.on ? '' : 'Touche un jour pour voir sa semaine. Pour en choisir plusieurs : « Sélectionner », ou appui long sur un jour.'}</p></div></div>`;
}

/* --- vue Semaine --- */
function planWeek() {
  const w = monday(A.plan.date), t = today(), end = addDays(w, 6), days = [0, 1, 2, 3, 4, 5, 6].map(i => addDays(w, i)), order = [A.me, otherP(A.me)];
  const label = `${pd(w).getDate()}${ymOf(w) !== ymOf(end) ? ' ' + fmtD(w, { month: 'short' }) : ''} – ${fmtD(end, { day: 'numeric', month: 'long' })}`;
  let g = `<div class="wk${SEL.on ? ' selm' : ''}"><span></span>${days.map((d, i) => `<button class="dh${d === t ? ' today' : ''}${i >= 5 ? ' we' : ''}${selCls(d)}"${SEL.on ? '' : ' data-act="plan-day-of"'} data-d="${d}" aria-label="${esc(dayLong(d))}">${DAYS[i]}<b>${pd(d).getDate()}</b><span class="dd">${dotsFor(eventsOn(d))}</span></button>`).join('')}`;
  order.forEach(p => { g += `<div class="pl">${av(p, 30)}</div>` + days.map((d, i) => `<div class="c3${i >= 5 ? ' we' : ''}">${SLOTS.map(s => slotBtn(p, d, s.k)).join('')}</div>`).join('') + '<div class="sp6"></div>'; });
  g += '</div>';
  let tog = 0; days.forEach(d => { tog += togetherCount(d); });
  const evs = []; days.forEach(d => eventsOn(d).forEach(e => evs.push(e)));
  const nRec = Object.keys(D.recurring).length;
  return `<div class="page wide">${hdr('Planning', 'Semaine ' + isoWeek(w), { right: todayChip, extra: `<div class="lvrow">${levelSeg()}${selBtn()}</div>` + navRow('plan-prev', 'plan-next', label) })}<div class="content">${selCard()}
    <div class="card" style="padding:12px 10px">${g}
      <div class="legend" style="padding:0 6px"><span>De haut en bas : matin, après-midi, soir</span>${tog ? `<span class="pill ok">${ico('heart', 13)}${tog} moment${tog > 1 ? 's' : ''} ensemble</span>` : ''}</div></div>
    <button class="wehl" data-act="weekend" data-d="${addDays(w, 5)}">${ico('sparkle', 22)}Programme du week-end<span class="grow"></span>${ico('chevR', 20)}</button>
    <div class="card"><h3>${ico('clock', 18)}Événements<span class="sp"></span><button class="lk" data-act="ev-new">Ajouter</button></h3>
      ${evs.length ? evs.map(e => { const pl = placeById(e.place); return `<button class="evrow" data-act="ev-edit" data-id="${esc(e.id)}"><span class="evd"><small>${esc(DAYS[wdi(e.date)])}</small><b>${pd(e.date).getDate()}</b></span><span class="grow"><div class="t" style="font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.title)}</div><div class="s sm mut">${e.time ? esc(e.time) : 'Toute la journée'}${pl ? ' · ' + esc(pl.icon) + ' ' + esc(pl.label) : ''}</div></span>${avs(whoList(e.who || 'both'))}</button>`; }).join('') : emptyH('cal', 'Rien de prévu cette semaine', 'Ajoute un dîner, un rendez-vous ou un week-end.', `<br><button class="btn btn-s btn-sm" data-act="ev-new">${ico('plus', 18)}Nouvel événement</button>`)}</div>
    ${legendH()}
    <div class="wkrow"><button class="btn btn-s btn-sm" data-act="rec-open">${ico('repeat', 18)}Répétitions${nRec ? ' (' + nRec + ')' : ''}</button><button class="btn btn-s btn-sm" data-act="tpl-open">${ico('copy', 18)}Modèles</button><button class="btn btn-s btn-sm" data-act="free-open">${ico('heart', 18)}À deux</button><button class="btn btn-s btn-sm" data-act="items-open" data-k="places">${ico('sliders', 18)}Lieux</button></div></div></div>`;
}

/* --- vue Jour --- */
function planDay() {
  const d = A.plan.date, t = today(), order = [A.me, otherP(A.me)], evs = eventsOn(d), exps = allExp().filter(e => e.date === d && e.kind !== 'settle');
  const rel = d === t ? 'Aujourd’hui' : d === addDays(t, 1) ? 'Demain' : d === addDays(t, -1) ? 'Hier' : wdi(d) >= 5 ? 'Week-end' : '';
  const tgs = SLOTS.filter(s => together(d, s.k));
  const gro = r2(exps.filter(e => e.cat === 'groceries').reduce((a, e) => a + e.amount, 0));
  const pres = `<div class="pres">${order.map(p => `<div class="presc"><div class="ph">${av(p, 28)}${esc(NAMES[p])}${p === A.me ? '<span class="mut sm" style="font-weight:500">(toi)</span>' : ''}</div>${SLOTS.map(s => { const pl = placeById(slotPlace(p, d, s.k)); return `<button class="pb${together(d, s.k) ? ' tg' : ''}"${pl ? ` style="--pc:${esc(pl.color)}"` : ''} data-act="slot" data-p="${p}" data-d="${d}" data-s="${s.k}"><span class="e">${pl ? esc(pl.icon) : '＋'}</span><span class="pbt"><small>${s.l}</small><b>${pl ? esc(pl.label) : 'À définir'}</b></span></button>`; }).join('')}</div>`).join('')}</div>`;
  const mealRow = (k, l) => { const m = mealOf(d, k); return `<button class="li" data-act="meal-edit" data-d="${d}" data-k="${k}"><span class="ic sm">${ico('meal', 18)}</span><span class="grow"><div class="t">${m ? esc(m.name) : 'Pas encore prévu'}</div><div class="s">${l}${m ? ' · ' + esc(whoName(m.who)) : ''}</div></span>${ico('chevR', 18)}</button>`; };
  return `<div class="page wide">${hdr(DAYN[wdi(d)].replace(/^./, c => c.toUpperCase()), rel || fmtD(d, { year: 'numeric' }), { back: 'plan-up', right: todayChip, extra: levelSeg() + navRow('plan-prev', 'plan-next', fmtD(d, { day: 'numeric', month: 'long', year: 'numeric' })) })}<div class="content">
    ${pres}
    ${tgs.length ? `<div class="note info" style="margin-top:12px"><span style="color:var(--accent-ink)">${ico('heart', 22)}</span><div class="grow"><b>Ensemble à la maison</b>${tgs.map(s => s.l.toLowerCase()).join(', ')}</div></div>` : ''}
    <div class="card"><h3>${ico('clock', 18)}Au programme<span class="sp"></span><button class="lk" data-act="ev-new-d" data-d="${d}">Ajouter</button></h3>
      ${evs.length ? `<div class="tl">${evs.map(e => { const pl = placeById(e.place); return `<div class="tr"><span class="tm">${e.time ? esc(e.time) : 'Jour'}</span><button class="evc" data-act="ev-edit" data-id="${esc(e.id)}"><span class="ic sm" style="--pc:${esc(pl ? pl.color : '#7FB89A')}">${pl ? esc(pl.icon) : '🗓️'}</span><span class="grow"><div class="t">${esc(e.title)}</div><div class="s">${pl ? esc(pl.label) : 'Lieu non précisé'}${e.note ? ' · ' + esc(e.note) : ''}</div></span>${e.remind ? `<span style="color:var(--accent-ink)">${ico('bell', 18)}</span>` : ''}${avs(whoList(e.who || 'both'))}</button></div>`; }).join('')}</div>` : `<p class="mut sm">Rien de prévu ce jour-là.</p>`}</div>
    <div class="card"><h3>${ico('meal', 18)}Repas</h3>${mealRow('lunch', 'Midi')}${mealRow('dinner', 'Soir')}</div>
    <div class="card"><h3>${ico('wallet', 18)}Dépenses du jour<span class="sp"></span><button class="lk" data-act="exp-new-d" data-d="${d}">Ajouter</button></h3>
      ${gro > 0 ? `<div class="pill ok" style="margin-bottom:8px">${ico('cart', 14)}Courses : ${fmt(gro)}</div>` : ''}
      ${exps.length ? exps.map(e => { const c = catById(e.cat); return `<button class="li" data-act="exp-edit" data-id="${esc(e.id)}"><span class="ic sm" style="--pc:${esc(c.color)}">${esc(c.icon)}</span><span class="grow"><div class="t">${esc(e.note || c.label)}</div><div class="s">${e.paidBy === A.me ? 'Payé par toi' : 'Payé par ' + esc(NAMES[e.paidBy])}${e._loc === 'priv' ? ' · perso' : ''}</div></span><span class="amount">${fmt(e.amount)}</span></button>`; }).join('') : `<p class="mut sm">Aucune dépense enregistrée ce jour-là.</p>`}</div></div></div>`;
}

/* --- navigation --- */
const planStep = n => { const P = A.plan; if (P.level === 'month') P.month = addM(P.month, n); else P.date = addDays(P.date, P.level === 'week' ? 7 * n : n); A.anim = n > 0 ? 'a-slL' : 'a-slR'; A.resetScroll = P.level === 'day'; schedule(); };
ACT['plan-prev'] = () => planStep(-1);
ACT['plan-next'] = () => planStep(1);
ACT['plan-today'] = () => { A.plan.date = today(); A.plan.month = ymOf(today()); A.anim = 'a-fade'; schedule(); };
ACT['plan-level'] = d => {
  if (d.v === 'day' && SEL.on) selReset();
  const P = A.plan, ord = { month: 0, week: 1, day: 2 }, v = d.v; if (v === P.level) return;
  if (v === 'month') P.month = ymOf(P.date);
  else if (P.level === 'month' && ymOf(P.date) !== P.month) P.date = ymOf(today()) === P.month ? today() : P.month + '-01';
  A.anim = ord[v] > ord[P.level] ? 'a-zin' : 'a-zout'; P.level = v; A.resetScroll = true; schedule();
};
ACT['plan-up'] = () => ACT['plan-level']({ v: A.plan.level === 'day' ? 'week' : 'month' });
ACT['plan-week-of'] = d => { A.plan.date = d.d; A.plan.level = 'week'; A.anim = 'a-zin'; A.resetScroll = true; schedule(); };
ACT['plan-day-of'] = d => { A.plan.date = d.d; A.plan.level = 'day'; A.anim = 'a-zin'; A.resetScroll = true; schedule(); };

/* --- saisie d'un créneau --- */
ACT.slot = d => {
  resetF({ person: d.p, date: d.d, slot: d.s, whole: false, weekly: false });
  openSheet(() => `<div class="st">${esc(NAMES[d.p])}${d.p === A.me ? ' (toi)' : ''}</div><div class="ss">${esc(dayLong(d.d))} · ${slotLbl(d.s)}</div>
    <div style="margin-top:8px">${swH('whole', 'Appliquer à toute la journée', false)}${swH('weekly', 'Répéter chaque ' + DAYN[wdi(d.d)], false)}</div>
    ${lbl('Où ?')}<div class="pgrid">${cfg().places.map(p => `<button data-act="slot-set" data-v="${esc(p.id)}" style="--pc:${esc(p.color)}"><b>${esc(p.icon)}</b><span>${esc(p.label)}</span></button>`).join('')}</div>
    <div class="btns two"><button class="btn btn-s" data-act="slot-set" data-v="">Effacer</button><button class="btn btn-g" data-act="items-open" data-k="places">Gérer les lieux</button></div>`);
};
ACT['slot-set'] = async d => {
  const place = d.v, { person, date, slot, whole, weekly } = F, slots = whole ? SLOTS.map(s => s.k) : [slot];
  closeSheet();
  await act(async () => {
    if (weekly) {
      if (place === '') { for (const [id, r] of Object.entries(D.recurring)) if (r.person === person && r.wd === wdi(date) && slots.some(s => (r.slots || []).includes(s))) await del('recurring', id); }
      else await put('recurring', uid(), { person, wd: wdi(date), slots, place, from: date, ts: Date.now() });
    }
    const upd = { date }; upd[person] = {}; slots.forEach(s => { upd[person][s] = place; });
    await patch('presence', date, upd);
  }, place ? 'C’est noté' : 'Effacé');
};
ACT['rec-open'] = () => {
  resetF();
  openSheet(() => {
    const list = Object.entries(D.recurring).map(([id, r]) => ({ id, ...r })).sort((a, b) => a.wd - b.wd);
    return `<div class="st">Répétitions chaque semaine</div><div class="ss">Elles remplissent le planning tant que tu ne saisis pas autre chose pour un jour précis.</div>
    <div style="margin-top:10px">${list.length ? list.map(r => { const pl = placeById(r.place); return `<div class="li"><span class="ic sm" style="--pc:${esc(pl ? pl.color : '#B5BDB8')}">${pl ? esc(pl.icon) : '📍'}</span><span class="grow"><div class="t">${esc(NAMES[r.person] || '')} · chaque ${DAYN[r.wd]}</div><div class="s">${pl ? esc(pl.label) : 'Lieu supprimé'} · ${(r.slots || []).map(slotLbl).join(', ')}</div></span><button class="ib flat" data-act="rec-del" data-id="${esc(r.id)}" aria-label="Supprimer">${ico('trash', 20)}</button></div>`; }).join('') : emptyH('repeat', 'Aucune répétition', 'Touche un créneau puis active « Répéter chaque … » pour en créer une.')}</div>`;
  }, { live: true });
};
ACT['rec-del'] = d => act(() => del('recurring', d.id), 'Répétition supprimée');

/* --- programme du week-end --- */
ACT.weekend = d => {
  resetF(); const sat = d.d;
  openSheet(() => {
    const block = day => {
      const evs = eventsOn(day), ml = mealOf(day, 'lunch'), md = mealOf(day, 'dinner'), tgs = SLOTS.filter(s => together(day, s.k));
      return `<div class="card tint" style="margin-top:12px"><div class="row"><b class="grow">${esc(dayLong(day))}</b><button class="btn btn-g" style="min-height:36px" data-act="go-day-close" data-d="${day}">Ouvrir</button></div>
      ${[A.me, otherP(A.me)].map(p => `<div class="row" style="margin-top:8px">${av(p, 26)}<span class="grow sm">${SLOTS.map(s => { const pl = placeById(slotPlace(p, day, s.k)); return `${pl ? esc(pl.icon) : '–'} <span class="mut">${s.k === 'a' ? 'après-midi' : s.l.toLowerCase()}</span>`; }).join('  ·  ')}</span></div>`).join('')}
      ${tgs.length ? `<div style="margin-top:8px"><span class="pill ok">${ico('heart', 13)}Ensemble : ${tgs.map(s => s.l.toLowerCase()).join(', ')}</span></div>` : ''}
      <div class="sm" style="margin-top:10px"><b>Midi</b> ${ml ? esc(ml.name) : '<span class="mut">à prévoir</span>'}<br><b>Soir</b> ${md ? esc(md.name) : '<span class="mut">à prévoir</span>'}</div>
      ${evs.length ? `<div style="margin-top:8px">${evs.map(e => `<div class="sm">${icoI('clock', 14)} ${e.time ? esc(e.time) + ' · ' : ''}<b>${esc(e.title)}</b></div>`).join('')}</div>` : `<div class="sm mut" style="margin-top:8px">Aucun événement</div>`}</div>`;
    };
    return `<div class="st">Programme du week-end</div><div class="ss">${esc(dayShort(sat))} et ${esc(dayShort(addDays(sat, 1)))}</div>${block(sat)}${block(addDays(sat, 1))}`;
  }, { live: true });
};
ACT['go-day-close'] = d => { closeSheet(); ACT['go-day'](d); };

/* --- événements --- */
function openEvent(o) {
  const ex = o.id ? D.events[o.id] : null;
  resetF({ id: o.id || '', place: ex ? ex.place || '' : '', who: ex ? ex.who || 'both' : 'both', remind: ex ? !!ex.remind : false });
  const places = [{ id: '', l: 'Non précisé' }].concat(cfg().places.map(p => ({ id: p.id, l: p.label, i: p.icon })));
  openSheet(() => `<div class="st">${ex ? 'Modifier l’événement' : 'Nouvel événement'}</div>
    ${lbl('Titre')}<input class="inp" id="ev-title" maxlength="80" placeholder="Ex. Dîner chez les parents" value="${esc(ex ? ex.title : '')}" autocomplete="off">
    <div class="row" style="align-items:flex-start"><div class="grow">${lbl('Date')}<input class="inp" id="ev-date" type="date" value="${esc(ex ? ex.date : (o.date || today()))}"></div><div class="grow">${lbl('Heure')}<input class="inp" id="ev-time" type="time" value="${esc(ex ? ex.time || '' : '')}"></div></div>
    ${lbl('Qui participe')}${segH('who', [{ id: A.me, l: 'Moi' }, { id: otherP(A.me), l: NAMES[otherP(A.me)] }, { id: 'both', l: 'Nous deux' }], F.who)}
    ${lbl('Lieu')}${chipsH('place', places, F.place).replace('class="chips"', 'class="chips scroll"')}
    ${lbl('Note')}<textarea class="inp" id="ev-note" placeholder="Facultatif">${esc(ex ? ex.note || '' : '')}</textarea>
    ${swH('remind', 'Rappel visuel sur l’accueil', F.remind)}
    <div class="btns ${ex ? 'two' : ''}">${ex ? `<button class="btn btn-d" data-act="ev-del">Supprimer</button>` : ''}<button class="btn btn-p" data-act="ev-save">Enregistrer</button></div>`, { focus: ex ? '' : 'ev-title' });
}
ACT['ev-edit'] = d => openEvent({ id: d.id });
ACT['ev-new-d'] = d => openEvent({ date: d.d });
ACT['ev-save'] = async () => {
  const title = val('ev-title').trim(), date = val('ev-date');
  if (!title) return toast('Donne un titre à l’événement', 'err'); if (!date) return toast('Choisis une date', 'err');
  const fid = F.id, id = fid || uid();
  const o = { title, date, time: val('ev-time') || '', who: F.who, place: F.place || '', note: val('ev-note').trim(), remind: !!F.remind, createdBy: A.me, ts: Date.now() };
  closeSheet(); await act(() => put('events', id, o), fid ? 'Événement modifié' : 'Événement ajouté');
};
ACT['ev-del'] = async () => { const id = F.id; closeSheet(); await act(() => del('events', id), 'Événement supprimé'); };

/* --- sélection multiple : actions --- */
ACT['sel-toggle'] = () => { if (SEL.on) selReset(); else { SEL.on = true; SEL.set.clear(); if (A.plan.level === 'day') { A.plan.level = 'week'; } } schedule(); };
ACT['sel-cancel'] = () => { selReset(); schedule(); };
ACT['sel-clear'] = () => { SEL.set.clear(); schedule(); };
const toggleMany = days => { const all = days.every(d => SEL.set.has(d)); days.forEach(d => { if (all) SEL.set.delete(d); else SEL.set.add(d); }); schedule(); };
ACT['sel-week'] = d => toggleMany([0, 1, 2, 3, 4, 5, 6].map(i => addDays(d.d, i)));
ACT['sel-weekview'] = () => { const w = monday(A.plan.date); toggleMany([0, 1, 2, 3, 4, 5, 6].map(i => addDays(w, i))); };
ACT['sel-month'] = () => { const m = A.plan.month; toggleMany(Array.from({ length: dim(m) }, (_, i) => m + '-' + pad(i + 1))); };
ACT['sel-wd'] = d => { const m = A.plan.month; toggleMany(Array.from({ length: dim(m) }, (_, i) => m + '-' + pad(i + 1)).filter(x => wdi(x) === +d.i)); };
ACT['sel-expand'] = () => { const r = selDays(); if (!r.length) return; new Set(r.map(x => monday(x))).forEach(w => { for (let i = 0; i < 7; i++) SEL.set.add(addDays(w, i)); }); schedule(); };
ACT['sel-open'] = () => {
  const days = selDays(); if (!days.length) return;
  resetF({ who: 'both', s_m: true, s_a: true, s_s: true, noWE: false });
  openSheet(() => {
    const n = days.length, we = days.filter(d => wdi(d) >= 5).length;
    return `<div class="st">${n} jour${n > 1 ? 's' : ''} d’un coup</div><div class="ss">${esc(selSummary())}</div>
    ${lbl('Pour qui ?')}${segH('who', whoOpts(true), F.who)}
    ${lbl('Quels moments ?')}<div class="chips">${SLOTS.map(s => `<button type="button" class="chip${F['s_' + s.k.charAt(0)] ? ' on' : ''}" data-toggle-chip="s_${s.k.charAt(0)}">${s.l}</button>`).join('')}</div>
    ${we ? `<div style="margin-top:8px">${swH('noWE', 'Ignorer les week-ends (' + we + ')', F.noWE)}</div>` : ''}
    ${tplChips()}
    ${lbl('Où ?')}<div class="pgrid">${cfg().places.map(p => `<button data-act="sel-apply" data-v="${esc(p.id)}" style="--pc:${esc(p.color)}"><b>${esc(p.icon)}</b><span>${esc(p.label)}</span></button>`).join('')}</div>
    <div class="btns two"><button class="btn btn-s" data-act="sel-apply" data-v="">Effacer ces créneaux</button><button class="btn btn-g" data-act="items-open" data-k="places">Gérer les lieux</button></div>`;
  }, { live: true });
};
document.addEventListener('click', e => {
  const c = e.target.closest('[data-toggle-chip]'); if (!c) return;
  const k = c.dataset.toggleChip; F[k] = !F[k]; c.classList.toggle('on', !!F[k]);
});
ACT['sel-apply'] = async d => {
  const place = d.v, slots = SLOTS.filter(s => F['s_' + s.k.charAt(0)]).map(s => s.k);
  if (!slots.length) return toast('Choisis au moins un moment', 'err');
  const persons = F.who === 'both' ? PIDS.slice() : [F.who];
  const days = selDays().filter(x => !(F.noWE && wdi(x) >= 5));
  if (!days.length) return toast('Aucun jour à modifier', 'err');
  closeSheet(); const snap = snapPresence(days);
  const ok = await act(async () => {
    for (let i = 0; i < days.length; i += 6) await Promise.all(days.slice(i, i + 6).map(day => { const upd = { date: day }; persons.forEach(p => { upd[p] = {}; slots.forEach(s => { upd[p][s] = place; }); }); return patch('presence', day, upd); }));
  }, place ? days.length + ' jour' + (days.length > 1 ? 's' : '') + ' mis à jour' : 'Créneaux effacés');
  if (ok) { selReset(); schedule(); offerUndo(restorePresence(snap), days.length + ' jour' + (days.length > 1 ? 's' : '') + ' modifié' + (days.length > 1 ? 's' : '')); }
};

/* ---------- 10. Repas : grille, plats, courses partagées ---------- */
const REC_EMO = { pates: '🍝', viande: '🍗', poisson: '🐟', veggie: '🥦', rapide: '⚡', soupe: '🥣', autre: '🍽️' };
const WHERE_S = { home: 'Maison', out: 'Dehors', resto: 'Restaurant', delivery: 'Livraison', family: 'Proches' };
const MK = ['lunch', 'dinner'];
const mkLbl = k => k === 'lunch' ? 'Midi' : 'Soir';
const mealSeg = () => `<div class="seg">${[['week', 'Semaine'], ['recipes', 'Plats'], ['shop', 'Courses']].map(([k, l]) => `<button class="${A.meal.sub === k ? 'on' : ''}" data-act="meal-sub" data-v="${k}">${k === 'shop' ? ico('cart', 16) : ''}${l}</button>`).join('')}</div>`;
const recList = () => Object.entries(D.recipes).map(([id, r]) => ({ id, ...r })).sort((a, b) => (b.fav ? 1 : 0) - (a.fav ? 1 : 0) || String(a.name).localeCompare(String(b.name), 'fr'));
const weekLabel = w => { const e = addDays(w, 6); return `${pd(w).getDate()}${ymOf(w) !== ymOf(e) ? ' ' + fmtD(w, { month: 'short' }) : ''} – ${fmtD(e, { day: 'numeric', month: 'long' })}`; };
const mealToday = `<button class="chip" data-act="meal-today">Aujourd’hui</button>`;
function vMeal() { const M = A.meal; return M.sub === 'recipes' ? mealRecipes() : M.sub === 'shop' ? mealShop() : (M.level === 'day' ? mealDay() : mealWeek()); }

/* --- grille de la semaine --- */
function mealCell(d, k) {
  const m = mealOf(d, k), drop = `data-drop="${d}|${k}"`;

}
function mealWeek() {
  const w = A.meal.week, t = today(), days = [0, 1, 2, 3, 4, 5, 6].map(i => addDays(w, i));
  let n = 0; days.forEach(d => MK.forEach(k => { if (mealOf(d, k) && mealOf(d, k).name) n++; }));

      ${n === 0 ? emptyH('meal', 'Semaine à planifier', 'Touche un repas pour choisir un plat, ou copie la semaine précédente.') : ''}</div>${panel}</div></div></div>`;
}

/* --- navigation --- */
function mealStep(n) {
  const M = A.meal; if (M.sub === 'recipes') return;
  if (M.level === 'day' && M.sub === 'week') { M.date = addDays(M.date, n); M.week = monday(M.date); }
  else { M.week = addDays(M.week, 7 * n); M.date = addDays(M.date, 7 * n); }
  A.anim = n > 0 ? 'a-slL' : 'a-slR'; schedule();
}
ACT['meal-prev'] = () => mealStep(-1);
ACT['meal-next'] = () => mealStep(1);
ACT['meal-today'] = () => { A.meal.week = monday(today()); A.meal.date = today(); A.anim = 'a-fade'; schedule(); };
ACT['meal-sub'] = d => { A.meal.sub = d.v; A.meal.level = 'week'; A.anim = 'a-fade'; A.resetScroll = true; schedule(); };
ACT['meal-day'] = d => { A.meal.level = 'day'; A.meal.date = d.d; A.anim = 'a-zin'; A.resetScroll = true; schedule(); };
ACT['meal-up'] = () => { A.meal.level = 'week'; A.meal.week = monday(A.meal.date); A.anim = 'a-zout'; A.resetScroll = true; schedule(); };
ACT['rec-cat'] = d => { A.meal.cat = d.v; schedule(); };

/* --- saisie d'un repas --- */
function suggestRecipe(excl) {
  const recs = recList(); if (!recs.length) return null;
  const t = today(), recent = new Set();
  for (let i = -14; i <= 0; i++) { const m = D.meals[addDays(t, i)]; if (m) MK.forEach(k => { if (m[k]) { if (m[k].recipeId) recent.add(m[k].recipeId); recent.add(norm(m[k].name)); } }); }
  let pool = recs.filter(r => !recent.has(r.id) && !recent.has(norm(r.name))); if (!pool.length) pool = recs;
  if (excl && pool.length > 1) pool = pool.filter(r => r.id !== excl);
  return pool[Math.floor(Math.random() * pool.length)];
}
function openMeal(d, k, pre) {
  pre = pre || {}; const ex = mealOf(d, k);
  resetF({ d, k, who: ex ? ex.who || 'both' : 'both', where: ex ? ex.where || 'home' : 'home', recipeId: ex ? ex.recipeId || '' : '', copyK: k });
  let name = ex ? ex.name : '';
  if (pre.suggest) { const r = suggestRecipe(); if (r) { name = r.name; F.recipeId = r.id; F._idea = r.id; } else toast('Ajoute d’abord quelques plats dans l’onglet Plats', 'err'); }
  const recs = recList().slice(0, 14);
  openSheet(() => `<div class="st">${mkLbl(k)} · ${esc(dayLong(d))}</div>
    ${lbl('Plat')}<input class="inp" id="ml-name" maxlength="70" placeholder="Ex. Pâtes au pesto" value="${esc(name)}" autocomplete="off">
    ${recs.length ? `<div class="chips scroll" style="margin-top:10px">${recs.map(r => `<button type="button" class="chip" data-act="ml-pick" data-id="${esc(r.id)}">${r.fav ? '♥ ' : ''}${esc(r.name)}</button>`).join('')}</div>` : ''}
    <div class="row" style="margin-top:8px;flex-wrap:wrap;gap:8px"><button type="button" class="btn btn-s btn-sm" data-act="ml-idea">${ico('sparkle', 18)}Idée repas</button><button type="button" class="btn btn-s btn-sm" data-act="ml-stock">${ico('cart', 18)}Avec nos achats</button><button type="button" class="btn btn-s btn-sm" data-act="ml-leftover">${ico('repeat', 18)}Restes ${k === 'dinner' ? 'demain midi' : 'ce soir'}</button></div>
    ${lbl('Qui mange')}${segH('who', [{ id: 'both', l: 'Nous deux' }, { id: A.me, l: 'Moi' }, { id: otherP(A.me), l: NAMES[otherP(A.me)] }], F.who)}
    ${lbl('Où')}${chipsH('where', MEAL_WHERE, F.where).replace('class="chips"', 'class="chips scroll"')}
    ${lbl('Note')}<input class="inp" id="ml-note" maxlength="100" placeholder="Facultatif" value="${esc(ex ? ex.note || '' : '')}">
    ${ex ? `${lbl('Dupliquer ce repas')}<div class="row" style="align-items:center"><input class="inp" type="date" id="ml-copy-d" value="${addDays(d, 1)}"><div style="flex:none">${segH('copyK', [{ id: 'lunch', l: 'Midi' }, { id: 'dinner', l: 'Soir' }], F.copyK)}</div></div><button type="button" class="btn btn-s btn-b" style="margin-top:8px" data-act="ml-copy">${ico('copy', 18)}Copier</button>` : ''}
    <div class="btns ${ex ? 'two' : ''}">${ex ? `<button class="btn btn-d" data-act="ml-del">Retirer</button>` : ''}<button class="btn btn-p" data-act="ml-save">Enregistrer</button></div>`);
}
function openMealNext() {
  const t = today(), start = (A.tab === 'meal' && A.meal.level === 'day') ? A.meal.date : t, late = new Date().getHours() >= 14;
  for (let i = 0; i < 14; i++) { const d = addDays(start, i); for (const k of MK) { if (d === t && k === 'lunch' && late) continue; if (!mealOf(d, k)) return openMeal(d, k); } }
  openMeal(start, 'dinner');
}
function saveMeal(d, k, obj, msg) { return act(() => patch('meals', d, { date: d, [k]: obj }), msg || 'Repas enregistré'); }
ACT['meal-edit'] = d => openMeal(d.d, d.k);
ACT['meal-idea-day'] = d => openMeal(d.d, d.k, { suggest: true });
ACT['ml-pick'] = d => { const r = D.recipes[d.id]; if (!r) return; const n = document.getElementById('ml-name'); if (n) n.value = r.name; F.recipeId = d.id; };
ACT['ml-idea'] = () => {
  const r = suggestRecipe(F._idea); if (!r) return toast('Ajoute d’abord quelques plats dans l’onglet Plats', 'err');
  F._idea = r.id; F.recipeId = r.id; const n = document.getElementById('ml-name'); if (n) n.value = r.name; toast('Idée : ' + r.name);
};
ACT['ml-save'] = async () => {
  const name = val('ml-name').trim(); if (!name) return toast('Choisis ou écris un plat', 'err');
  let rid = F.recipeId; if (!(rid && D.recipes[rid] && norm(D.recipes[rid].name) === norm(name))) { const f = Object.entries(D.recipes).find(([, r]) => norm(r.name) === norm(name)); rid = f ? f[0] : ''; }
  const { d, k } = F, obj = { name, recipeId: rid, who: F.who, where: F.where, note: val('ml-note').trim() };
  closeSheet(); await saveMeal(d, k, obj);
};
ACT['ml-del'] = async () => { const { d, k } = F, prev = mealOf(d, k) ? clean(mealOf(d, k)) : null; closeSheet(); const ok = await act(() => patch('meals', d, { [k]: null }), 'Repas retiré'); if (ok && prev) offerUndo(() => patch('meals', d, { date: d, [k]: prev }), 'Repas retiré'); };
ACT['ml-copy'] = async () => {
  const src = mealOf(F.d, F.k), cd = val('ml-copy-d'); if (!src || !cd) return toast('Choisis une date', 'err');
  const ck = F.copyK; closeSheet(); await saveMeal(cd, ck, Object.assign({}, src), 'Repas copié au ' + dayShort(cd));
};
ACT['meal-copy-week'] = async () => {
  const w = A.meal.week, pw = addDays(w, -7); let n = 0; const jobs = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(w, i), src = D.meals[addDays(pw, i)]; if (!src) continue; const upd = { date: d };
    MK.forEach(k => { if (src[k] && src[k].name && !(mealOf(d, k) && mealOf(d, k).name)) { upd[k] = Object.assign({}, src[k]); n++; } });
    if (Object.keys(upd).length > 1) jobs.push(() => patch('meals', d, upd));
  }
  if (!n) return toast('Rien à copier : la semaine précédente est vide ou déjà reprise', 'err');
  await act(async () => { for (const j of jobs) await j(); }, n + ' repas copiés');
};
function dropMeal(raw, d, k) {
  let p; try { p = JSON.parse(raw); } catch (e) { return; }
  if (p.t === 'r') { const r = D.recipes[p.id]; if (r) saveMeal(d, k, { name: r.name, recipeId: p.id, who: 'both', where: 'home', note: '' }, 'Plat ajouté'); }
  else if (p.t === 'm') { const s = mealOf(p.d, p.k); if (s && !(p.d === d && p.k === k)) saveMeal(d, k, Object.assign({}, s), 'Repas copié'); }
}

  return `<div class="page wide">${hdr('Repas', '', { extra: mealSeg() })}<div class="content">${catChips}
    <div class="card"><h3>${ico('heart', 18)}Mes plats<span class="sp"></span><button class="lk" data-act="rec-new">Ajouter</button></h3>
      ${list.length ? list.map(r => { const n = (r.ingredients || []).length, cl = (REC_CATS.find(c => c.id === r.cat) || {}).l || 'Autre'; return `<div class="rrow"><button class="main" data-act="rec-edit" data-id="${esc(r.id)}"><span class="ic" style="--pc:var(--sage)">${REC_EMO[r.cat] || '🍽️'}</span><span class="grow"><div class="t" style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</div><div class="s sm mut">${esc(cl)}${r.time ? ' · ' + r.time + ' min' : ''}${n ? ` · ${n} ingrédient${n > 1 ? 's' : ''}` : ''}</div></span></button><button class="hb${r.fav ? ' on' : ''}" data-act="rec-fav" data-id="${esc(r.id)}" aria-label="Favori">${ico('heart', 22)}</button></div>`; }).join('')
        : emptyH('meal', cat ? 'Aucun plat dans cette catégorie' : 'Votre bibliothèque est vide', 'Ajoutez les plats que vous cuisinez souvent, avec leurs ingrédients. Les courses se génèrent toutes seules.', `<br><button class="btn btn-p" data-act="rec-new">${ico('plus', 20)}Ajouter un plat</button>`)}</div>

}
ACT['rec-new'] = () => openRecipe('');
ACT['rec-edit'] = d => openRecipe(d.id);

ACT['diet-edit'] = () => {

/* --- liste de courses partagée --- */
function mealShop() {
  const w = A.meal.week, chk = (D.shopchecks[w] && D.shopchecks[w].checked) || {};
  const rows = groceryItems(w).map(i => ({ k: 'a:' + i.key, name: i.name, q: i.hasQty ? qtyStr(r2(i.qty)) + (i.unit ? ' ' + i.unit : '') : '', aisle: i.aisle, done: !!chk[i.key], from: i.from.join(', ') }));
  Object.entries(D.shopitems).filter(([, x]) => x.week === w).forEach(([id, x]) => rows.push({ k: 'm:' + id, name: x.name, q: x.qty != null ? qtyStr(x.qty) + (x.unit ? ' ' + x.unit : '') : '', aisle: x.aisle || 'autre', done: !!x.done, man: true }));
  const total = rows.length, done = rows.filter(r => r.done).length;
  const groups = AISLES.map(a => ({ a, items: rows.filter(r => r.aisle === a.id).sort((x, y) => (x.done - y.done) || x.name.localeCompare(y.name, 'fr')) })).filter(g => g.items.length);
  const ck = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const manDone = rows.filter(r => r.man && r.done).length;
  return `<div class="page wide">${hdr('Repas', 'Semaine ' + isoWeek(w), { right: mealToday, extra: mealSeg() + navRow('meal-prev', 'meal-next', weekLabel(w)) })}<div class="content">
    <div class="card"><div class="addrow"><input class="inp" id="shop-new" placeholder="Ajouter un article (ex. 2 yaourts)" autocomplete="off" enterkeyhint="done"><button class="btn btn-p" data-act="shop-add" aria-label="Ajouter">${ico('plus', 22, 2.2)}</button></div>${freqChips()}
      ${total ? `<div class="row" style="margin-top:14px"><b class="grow">${done} sur ${total} dans le panier</b><span class="mut sm">${Math.round(done / total * 100)} %</span></div><div class="prog"><i style="width:${Math.round(done / total * 100)}%"></i></div>` : ''}</div>
    ${groups.length ? `<div class="card">${groups.map(g => `<div class="aisle">${esc(g.a.l)}</div>${g.items.map(r => `<button class="shop${r.done ? ' done' : ''}" data-act="shop-toggle" data-k="${esc(r.k)}"><span class="ck">${ck}</span><span class="grow" style="min-width:0"><span class="t" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span>${r.from ? `<span class="s sm mut" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.from)}</span>` : ''}</span><span class="q">${esc(r.q)}</span></button>`).join('')}`).join('')}</div>
      <div class="btns"><button class="btn btn-p btn-b" data-act="shop-pay">${ico('wallet', 20)}Enregistrer le passage en caisse</button>${manDone ? `<button class="btn btn-s btn-b" data-act="shop-clear">Retirer mes articles cochés</button>` : ''}</div>`
      : `<div class="card">${emptyH('cart', 'Liste vide', 'Planifiez des repas avec ingrédients : la liste se remplit toute seule. Vous pouvez aussi ajouter un article ci-dessus.')}</div>`}
    <p class="sync-note">Les cases cochées se voient en direct chez ${esc(NAMES[otherP(A.me)])}.</p></div></div>`;
}
ACT['shop-toggle'] = d => {

  if (k.startsWith('m:')) { const id = k.slice(2), x = D.shopitems[id]; if (x) act(() => patch('shopitems', id, { done: !x.done })); }

/* ---------- 11. Budget du foyer ---------- */
const icoI = (n, s = 14) => ico(n, s).replace('class="i"', 'class="i inl"');
const budSeg = () => `<div class="seg s4">${[['over', 'Aperçu'], ['tx', 'Liste'], ['inc', 'Revenus'], ['goals', 'Épargne']].map(([k, l]) => `<button class="${A.bud.sub === k ? 'on' : ''}" data-act="bud-sub" data-v="${k}">${l}</button>`).join('')}</div>`;
const mixC = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
function pgColor(r) { const g = [127, 184, 154], o = [240, 178, 122], rd = [229, 140, 140]; const c = r <= .6 ? g : r <= .9 ? mixC(g, o, (r - .6) / .3) : r <= 1.05 ? mixC(o, rd, (r - .9) / .15) : rd; return 'rgb(' + c.join(',') + ')'; }

/* charges fixes : générées automatiquement chaque mois (identifiants stables, aucun doublon possible) */
const GEN = {};
function ensureMonth() {
  const m = ymOf(today()); if (GEN[m] || !A.ready || !A.me || A.canWrite === false) return;
  if (D.months[m] && D.months[m].generated) { GEN[m] = 1; return; }
  GEN[m] = 1; genMonth(m);
}
async function genMonth(m) {
  const c = cfg(), items = [{ id: 'rent', label: 'Loyer', cat: 'rent', amount: Math.max(0, r2(c.rent.amount - c.rent.apl)), day: c.rent.day, paidBy: c.rent.paidBy, pct: 50, note: 'Loyer ' + fmt(c.rent.amount) + ' − APL ' + fmt(c.rent.apl) }];
  c.fixed.forEach(f => items.push({ id: f.id, label: f.label, cat: f.cat, amount: f.amount, day: f.day, paidBy: f.paidBy, pct: f.pct, note: f.label }));
  await act(async () => {
    for (const it of items) {
      const id = 'fx_' + it.id + '_' + m; if (D.expenses[id] || !(it.amount > 0)) continue;
      const mode = it.pct === 50 ? '50' : 'custom';
      await put('expenses', id, { kind: 'expense', amount: it.amount, cat: it.cat, paidBy: it.paidBy, mode, shares: buildShares(it.amount, mode, it.paidBy, it.pct), date: m + '-' + pad(Math.min(it.day, dim(m))), note: it.note, auto: true, fixedId: it.id, ts: Date.now() });
    }
    await put('months', m, { generated: true, ts: Date.now() });
  });
}

/* --- aperçu --- */
function donut(parts, total) {
  const R = 15.9155; let off = 25;
  const segs = parts.map(p => { const pc = p.v / total * 100, d = Math.max(pc - 0.7, 0.2); const s = `<circle cx="21" cy="21" r="${R}" fill="none" stroke="${esc(p.color)}" stroke-width="5.4" stroke-dasharray="${d.toFixed(2)} ${(100 - d).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"/>`; off -= pc; return s; }).join('');
  return `<svg class="donut" viewBox="0 0 42 42" role="img" aria-label="Répartition des dépenses communes"><circle cx="21" cy="21" r="${R}" fill="none" stroke="var(--soft)" stroke-width="5.4"/>${segs}<text x="21" y="21.2" text-anchor="middle" font-size="4.6" font-weight="800" fill="var(--ink)">${esc(fmt(Math.round(total)))}</text><text x="21" y="25.8" text-anchor="middle" font-size="2.7" fill="var(--ink2)">communs</text></svg>`;
}
function budOver() {
  const m = A.bud.month, c = cfg(), o = otherP(A.me), bal = myBalance();
  const shared = monthExp(m).filter(isShared), total = commonTotal(m), prevT = commonTotal(addM(m, -1));
  const byCat = {}; shared.forEach(e => { byCat[e.cat] = (byCat[e.cat] || 0) + e.amount; });
  const parts = Object.entries(byCat).map(([id, v]) => Object.assign({}, catById(id), { v: r2(v) })).sort((a, b) => b.v - a.v);
  let cmp = '';
  if (prevT > 0 && total > 0) { const pc = Math.round((total - prevT) / prevT * 100); cmp = `<span class="pill ${pc > 10 ? 'warn' : pc < 0 ? 'ok' : ''}">${pc > 0 ? '+' : ''}${pc} % par rapport à ${esc(fmtD(addM(m, -1) + '-01', { month: 'long' }))}</span>`; }
  const balTxt = Math.abs(bal) < 0.5 ? `Vous êtes <span style="color:var(--accent-ink)">quittes</span>` : bal > 0 ? `${esc(NAMES[o])} te doit <span style="color:var(--accent-ink)">${fmt(bal)}</span>` : `Tu dois <span style="color:var(--accent-ink)">${fmt(-bal)}</span> à ${esc(NAMES[o])}`;
  const tg = Object.entries(c.targets).filter(([, v]) => v > 0), rn = c.rent, rest = Math.max(0, r2(rn.amount - rn.apl));
  const hist = [5, 4, 3, 2, 1, 0].map(i => { const mm = addM(m, -i); return { m: mm, v: commonTotal(mm) }; }), mx = Math.max(1, ...hist.map(h => h.v));
  const splitTxt = f => f.pct === 50 ? '50 / 50' : `${f.pct} / ${100 - f.pct}`;
  return `${!c.amountsOk ? `<div class="note"><div class="grow"><b>Montants d’exemple</b>Le loyer et les charges fixes sont pré-remplis avec des valeurs indicatives. Touche-les pour mettre les vrais montants.<div style="margin-top:8px"><button class="btn btn-s btn-sm" data-act="amounts-ok">C’est déjà bon</button></div></div></div>` : ''}
    <div class="card"><h3>${ico('swap', 18)}Solde du foyer</h3><div class="bal"><div class="grow"><div class="big" style="font-size:27px">${balTxt}</div></div>${Math.abs(bal) >= 0.5 ? `<button class="btn btn-p" data-act="settle-open">Régler</button>` : `<span class="pill ok">${icoI('check', 14)}À jour</span>`}</div></div>
    <div class="card"><h3>${ico('wallet', 18)}Dépenses communes</h3>
      <div class="row" style="flex-wrap:wrap;gap:8px"><div class="big">${fmt(total)}</div><span class="grow"></span>${cmp}</div>
      ${parts.length ? `<div class="donutw" style="margin-top:14px">${donut(parts, total)}<div class="leg">${parts.map(p => `<div class="legi"><i style="background:${esc(p.color)}"></i><span class="grow">${esc(p.icon)} ${esc(p.label)}</span><b class="amount sm">${fmt(p.v)}</b><span class="mut sm" style="width:38px;text-align:right">${Math.round(p.v / total * 100)} %</span></div>`).join('')}</div></div>` : emptyH('wallet', 'Pas encore de dépense commune', 'Ajoute une dépense avec le bouton +, elle apparaîtra ici.')}</div>
    ${paidCard(m)}
    <div class="grid2">
    <div class="card"><h3>${ico('target', 18)}Budgets cibles<span class="sp"></span><button class="lk" data-act="tgt-edit" data-id="">Ajouter</button></h3>
      ${tg.length ? tg.map(([id, v]) => { const cat = catById(id), spent = r2(byCat[id] || 0), r = spent / v; return `<button class="tgt" data-act="tgt-edit" data-id="${esc(id)}"><div class="row"><span class="ic sm" style="--pc:${esc(cat.color)}">${esc(cat.icon)}</span><span class="grow t" style="font-weight:600">${esc(cat.label)}</span><span class="amount sm">${fmt(spent)} / ${fmt(v)}</span></div><div class="pg"><i style="width:${Math.min(100, Math.round(r * 100))}%;background:${pgColor(r)}"></i></div>${r > 1 ? `<div class="sm" style="color:var(--bad-ink);margin-top:6px">Dépassé de ${fmt(spent - v)}</div>` : ''}</button>`; }).join('') : `<p class="mut sm">Fixe un plafond mensuel par catégorie, par exemple 400 € pour les courses.</p>`}</div>
    <div class="card tap" role="button" tabindex="0" data-act="rent-edit"><h3>${ico('home', 18)}Loyer<span class="sp"></span><span style="font-size:14px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--accent-ink)">Modifier</span></h3>
      <div class="calc"><div class="r"><span>Loyer</span><b>${fmt(rn.amount)}</b></div><div class="r"><span>APL déduite</span><b>− ${fmt(rn.apl)}</b></div><div class="r t"><span>Reste à charge</span><b>${fmt(rest)}</b></div><div class="r sub"><span>Part de chacun (50 / 50)</span><b>${fmt(rest / 2)}</b></div></div>

      ${c.fixed.map(f => { const cat = catById(f.cat); return `<button class="li" data-act="fx-edit" data-id="${esc(f.id)}"><span class="ic sm" style="--pc:${esc(cat.color)}">${esc(cat.icon)}</span><span class="grow"><div class="t">${esc(f.label)}</div><div class="s">Le ${f.day} · avancé par ${f.paidBy === A.me ? 'toi' : esc(NAMES[f.paidBy])} · ${splitTxt(f)}</div></span><span class="amount">${fmt(f.amount)}</span></button>`; }).join('') || '<p class="mut sm">Aucune charge fixe.</p>'}</div>
    <div class="card"><h3>${ico('cal', 18)}Historique</h3><div class="bars">${hist.map(h => `<button class="${h.m === m ? 'on' : ''}" data-act="bud-month" data-m="${h.m}" aria-label="${esc(monthLabel(h.m) + ' : ' + fmt(h.v))}"><span>${h.v ? Math.round(h.v) : ''}</span><i style="height:${Math.round(h.v / mx * 70) + 4}px"></i><span>${esc(fmtD(h.m + '-01', { month: 'short' }).replace('.', ''))}</span></button>`).join('')}</div></div>
    <div class="btns"><button class="btn btn-s btn-b" data-act="bud-csv">${ico('download', 20)}Exporter ${esc(fmtD(m + '-01', { month: 'long' }))} en CSV</button></div>`;
}

/* --- liste des transactions --- */
function txFiltered() {
  const f = A.bud.f, m = A.bud.month; let list = allExp();
  if (f.per === 'month') list = list.filter(e => e.date && e.date.slice(0, 7) === m);
  else if (f.per === '3m') { const from = addM(ymOf(today()), -2) + '-01'; list = list.filter(e => e.date >= from); }
  if (f.cat) list = list.filter(e => e.cat === f.cat && e.kind !== 'settle');
  if (f.who) list = list.filter(e => e.kind === 'settle' ? e.from === f.who : e.paidBy === f.who);
  if (f.q) { const q = norm(f.q); list = list.filter(e => norm((e.note || '') + ' ' + (e.kind === 'settle' ? 'remboursement' : catById(e.cat).label) + ' ' + String(e.amount).replace('.', ',') + ' ' + e.amount).includes(q)); }
  return list;
}
function txRow(e) {
  if (e.kind === 'settle') return `<button class="li" data-act="exp-edit" data-id="${esc(e.id)}"><span class="ic sm">${ico('swap', 18)}</span><span class="grow"><div class="t">Remboursement</div><div class="s">${esc(NAMES[e.from])} → ${esc(NAMES[e.to])}</div></span><span class="amount">${fmt(e.amount)}</span></button>`;
  const c = catById(e.cat), pm = e.amount > 0 && e.shares ? Math.round((e.shares.maxym || 0) / e.amount * 100) : 50;
  const mode = e.mode === 'perso' ? 'Perso' : e.mode === 'custom' ? `${NAMES.maxym[0]} ${pm} · ${NAMES.sasha[0]} ${100 - pm}` : '50 / 50';
  return `<button class="li" data-act="exp-edit" data-id="${esc(e.id)}"><span class="ic sm" style="--pc:${esc(c.color)}">${esc(c.icon)}</span><span class="grow"><div class="t">${esc(e.note || c.label)}</div><div class="s">${e.paidBy === A.me ? 'Toi' : esc(NAMES[e.paidBy])} · ${esc(c.label)} · ${esc(mode)}${e._loc === 'priv' ? ' ' + icoI('lock', 12) : ''}</div></span><span class="amount">${fmt(e.amount)}</span></button>`;
}
function txListHtml() {
  const f = A.bud.f, list = txFiltered(), lim = f.lim || 80, shown = list.slice(0, lim);
  if (!list.length) return emptyH('wallet', 'Aucune opération', 'Change les filtres ou ajoute une dépense avec le bouton +.');
  const sum = r2(list.filter(e => e.kind !== 'settle').reduce((a, e) => a + e.amount, 0));
  let html = `<div class="row"><b class="grow">${list.length} opération${list.length > 1 ? 's' : ''}</b><span class="amount">${fmt(sum)}</span></div>`, cur = '';
  shown.forEach(e => {
    if (e.date !== cur) { cur = e.date; const dt = r2(list.filter(x => x.date === cur && x.kind !== 'settle').reduce((a, x) => a + x.amount, 0)); html += `<div class="dayh"><span>${esc(dayLong(cur))}</span><span>${dt ? fmt(dt) : ''}</span></div>`; }
    html += txRow(e);
  });
  if (list.length > lim) html += `<button class="btn btn-s btn-b" style="margin-top:12px" data-act="tx-more">Afficher plus (${list.length - lim})</button>`;
  return html;
}
function budTx() {
  const f = A.bud.f, c = cfg();
  return `<div class="fbar"><div class="sbox">${ico('search', 20)}<input class="inp" id="tx-q" type="search" placeholder="Rechercher une dépense" value="${esc(f.q)}" autocomplete="off"></div>
    <div class="seg">${[['month', 'Ce mois'], ['3m', '3 mois'], ['all', 'Tout']].map(([k, l]) => `<button class="${f.per === k ? 'on' : ''}" data-act="tx-per" data-v="${k}">${l}</button>`).join('')}</div>
    <div class="chips scroll">${[{ id: '', l: 'Toutes', i: '' }].concat(c.cats.map(x => ({ id: x.id, l: x.label, i: x.icon }))).map(x => `<button class="chip${f.cat === x.id ? ' on' : ''}" data-act="tx-cat" data-v="${esc(x.id)}">${x.i ? esc(x.i) + ' ' : ''}${esc(x.l)}</button>`).join('')}</div>
    <div class="chips">${[{ id: '', l: 'Tous' }].concat(PIDS.map(p => ({ id: p, l: 'Payé par ' + (p === A.me ? 'moi' : NAMES[p]) }))).map(x => `<button class="chip${f.who === x.id ? ' on' : ''}" data-act="tx-who" data-v="${x.id}">${esc(x.l)}</button>`).join('')}</div></div>
    <div class="card" id="tx-list">${txListHtml()}</div>`;

/* --- revenus privés et reste à vivre --- */
function myCosts(m) {
  let common = 0, perso = 0;
  monthExp(m).forEach(e => { if (e.mode === 'perso' || e._loc === 'priv') perso += e.amount; else { const sh = e.shares || { maxym: e.amount / 2, sasha: e.amount / 2 }; common += sh[A.me] || 0; } });
  return { common: r2(common), perso: r2(perso) };
}
const incItems = m => { const d = D.priv['income_' + m]; return (d && d.items) || []; };
function budInc() {
  const m = A.bud.month, items = incItems(m), prev = incItems(addM(m, -1)), tot = r2(items.reduce((a, i) => a + i.amount, 0)), cs = myCosts(m), left = r2(tot - cs.common - cs.perso);
  const pv = n => A.hide ? '•••• €' : fmt(n);
  return `<div class="card"><h3>${ico('lock', 16)}Reste à vivre<span class="sp"></span><button class="eye" data-act="hide-toggle">${ico(A.hide ? 'eye' : 'eyeoff', 20)}${A.hide ? 'Afficher' : 'Masquer'}</button></h3>
    <div class="big" style="color:${left < 0 && !A.hide ? 'var(--bad-ink)' : 'var(--ink)'}">${pv(left)}</div>
    <div class="calc" style="margin-top:14px"><div class="r"><span>Revenus du mois</span><b>${pv(tot)}</b></div><div class="r"><span>Ta part des dépenses communes</span><b>− ${pv(cs.common)}</b></div><div class="r"><span>Tes dépenses perso</span><b>− ${pv(cs.perso)}</b></div></div>
    <p class="mut sm" style="margin-top:12px">${icoI('lock', 13)} Visible par toi seul. ${esc(NAMES[otherP(A.me)])} ne voit ni tes revenus ni tes dépenses perso.${DB && !UID ? ' Sur cet appareil uniquement.' : ''}</p></div>
    <div class="card"><h3>${ico('wallet', 18)}Mes rentrées d’argent<span class="sp"></span><button class="lk" data-act="inc-new">Ajouter</button></h3>
      ${items.length ? items.map(i => `<button class="li" data-act="inc-edit" data-id="${esc(i.id)}"><span class="ic sm">${ico('wallet', 18)}</span><span class="grow t">${esc(i.label)}</span><span class="amount">${pv(i.amount)}</span></button>`).join('') : emptyH('wallet', 'Aucune rentrée ce mois-ci', 'Salaire, aides, autres revenus : ils servent à calculer ton reste à vivre.', `<br><button class="btn btn-p" data-act="inc-new">${ico('plus', 20)}Ajouter un revenu</button>`)}
      ${!items.length && prev.length ? `<button class="btn btn-s btn-b" style="margin-top:10px" data-act="inc-copy">Reprendre ceux du mois précédent</button>` : ''}</div>`;
}

/* --- épargne --- */
function goalSums(g) { const by = { maxym: 0, sasha: 0 }; Object.values(D.contribs).forEach(c => { if (c.goalId === g.id) by[c.who] = (by[c.who] || 0) + c.amount; }); return { by, cur: r2(by.maxym + by.sasha) }; }
function budGoals() {
  const goals = Object.entries(D.goals).map(([id, g]) => ({ id, ...g })).sort((a, b) => (a.ts || 0) - (b.ts || 0));
  if (!goals.length) return `<div class="card">${emptyH('target', 'Un objectif commun', 'Voyage, apport, projet : fixez un montant et suivez la progression à deux.', `<br><button class="btn btn-p" data-act="goal-new">${ico('plus', 20)}Créer un objectif</button>`)}</div>`;
  return goals.map(g => {
    const s = goalSums(g), pc = g.target > 0 ? Math.min(100, Math.round(s.cur / g.target * 100)) : 0;
    const cs = Object.entries(D.contribs).filter(([, c]) => c.goalId === g.id).map(([id, c]) => ({ id, ...c })).sort((a, b) => String(b.date).localeCompare(String(a.date))).slice(0, 4);
    return `<div class="card"><h3>${ico('target', 18)}${esc(g.name)}<span class="sp"></span><button class="lk" data-act="goal-edit" data-id="${esc(g.id)}">Modifier</button></h3>
      <div class="row" style="align-items:baseline"><div class="big">${fmt(s.cur)}</div><span class="mut grow">sur ${fmt(g.target)}</span><b style="color:var(--accent-ink)">${pc} %</b></div>
      <div class="pg"><i style="width:${pc}%;background:var(--sage)"></i></div>
      <div class="row" style="margin-top:14px">${PIDS.map(p => `<div class="grow row">${av(p, 28)}<div><div class="sm mut">${esc(NAMES[p])}</div><b>${fmt(s.by[p] || 0)}</b></div></div>`).join('')}</div>
      ${cs.length ? `<div style="margin-top:10px">${cs.map(c => `<button class="li" data-act="contrib-edit" data-id="${esc(c.id)}"><span>${av(c.who, 26)}</span><span class="grow"><div class="t">${fmt(c.amount)}</div><div class="s">${esc(dayLong(c.date))}</div></span>${ico('chevR', 16)}</button>`).join('')}</div>` : ''}
      <div class="btns"><button class="btn btn-p btn-b" data-act="contrib-new" data-id="${esc(g.id)}">${ico('plus', 20)}Ajouter une contribution</button></div></div>`;
  }).join('') + `<div class="btns"><button class="btn btn-s btn-b" data-act="goal-new">Nouvel objectif</button></div>`;
}

ACT['tx-per'] = d => { A.bud.f.per = d.v; A.bud.f.lim = 0; schedule(); };
ACT['tx-cat'] = d => { A.bud.f.cat = d.v; A.bud.f.lim = 0; schedule(); };

/* --- dépense --- */
const modeHint = v => v === 'perso' ? 'Dépense personnelle : visible par toi seul, sans effet sur le solde.' : v === 'custom' ? 'Choisis la part de chacun avec le curseur.' : 'Chacun paie la moitié, le solde se met à jour tout seul.';
function openExpense(id, pre) {
  pre = pre || {}; const ex = id ? allExp().find(e => e.id === id) : null;
  if (ex && ex.kind === 'settle') return openSettleView(ex);

  if (!rows.length) return toast('Aucune opération ce mois-ci', 'err');
  const lines = [['Date', 'Type', 'Catégorie', 'Description', 'Montant (€)', 'Payé par', 'Répartition', 'Part ' + NAMES.maxym + ' (€)', 'Part ' + NAMES.sasha + ' (€)'].map(csvCell).join(';')];

    else { const sh = e.shares || {}; lines.push([e.date, e._loc === 'priv' ? 'Dépense perso' : 'Dépense commune', catById(e.cat).label, e.note || '', csvNum(e.amount), NAMES[e.paidBy], e.mode === 'perso' ? 'Perso' : e.mode === 'custom' ? 'Sur mesure' : '50/50', csvNum(sh.maxym || 0), csvNum(sh.sasha || 0)].map(csvCell).join(';')); }

function renderSearch(q) {
  const box = document.getElementById('q-res'); if (!box) return;
  const n = norm(q.trim()), has = (...t) => !n || t.some(x => norm(String(x || '')).includes(n));
  const row = (ic, t, s, data) => `<button class="srow" data-act="srch-go" ${data}><span class="ic sm">${ic}</span><span class="grow"><div class="t" style="font-weight:600">${esc(t)}</div>${s ? `<div class="s sm mut">${esc(s)}</div>` : ''}</span></button>`;
  const grp = (t, rows) => rows.length ? `<div class="sgrp">${t}</div>${rows.join('')}` : '';
  const acts = SRCH_ACT.filter(a => has(a[1], a[3])).slice(0, n ? 5 : 7).map(a => row(ico(a[2], 20), a[1], '', `data-k="act" data-id="${a[0]}"`));
  let out = grp(n ? 'Actions' : 'Actions rapides', acts);
  if (n) {
    const ev = Object.entries(D.events).filter(([, e]) => has(e.title, e.note)).sort((a, b) => b[1].date.localeCompare(a[1].date)).slice(0, 5).map(([id, e]) => row('🗓️', e.title, dayLong(e.date) + (e.time ? ' · ' + e.time : ''), `data-k="ev" data-id="${esc(id)}"`));
    const rc = recList().filter(r => has(r.name, (r.ingredients || []).map(i => i.n).join(' '))).slice(0, 5).map(r => row(r.fav ? '♥' : '🍽️', r.name, r.time ? r.time + ' min' : '', `data-k="rc" data-id="${esc(r.id)}"`));
    const ml = []; Object.entries(D.meals).sort((a, b) => b[0].localeCompare(a[0])).forEach(([d, m]) => MK.forEach(k => { if (m[k] && has(m[k].name) && ml.length < 5) ml.push(row('🥘', m[k].name, mkLbl(k) + ' · ' + dayLong(d), `data-k="ml" data-id="${d}" data-s="${k}"`)); }));
    const ex = allExp().filter(e => e.kind !== 'settle' && has(e.note, catById(e.cat).label, String(e.amount).replace('.', ','))).slice(0, 6).map(e => row(catById(e.cat).icon, (e.note || catById(e.cat).label) + ' · ' + fmt(e.amount), dayLong(e.date), `data-k="ex" data-id="${esc(e.id)}"`));
    const ch = chList().filter(c => has(c.title)).slice(0, 4).map(c => row(c.icon || '✨', c.title, chRel(c.due), `data-k="ch" data-id="${esc(c.id)}"`));
    out += grp('Événements', ev) + grp('Plats', rc) + grp('Repas prévus', ml) + grp('Dépenses', ex) + grp('Tâches', ch);
    if (out.indexOf('srow') < 0) out = `<p class="mut" style="text-align:center;margin-top:28px">Rien trouvé pour « ${esc(q)} ».</p>`;
  }
  box.innerHTML = out;
}
document.addEventListener('input', e => { if (e.target && e.target.id === 'q-in') renderSearch(e.target.value); });
