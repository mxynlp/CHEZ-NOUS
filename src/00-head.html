<title>Chez nous</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* =====================================================================
   CHEZ NOUS — styles
   Concept : coque iOS (barre d'onglets en bas, feuilles modales, verre dépoli)
   Palette : vert sauge #7FB89A · menthe #A8D5BA · vert profond #2F5D4A
   ===================================================================== */
:root{
  --bg:#E7F1EA; --bg-hi:#F4F9F6; --card:#FFFFFF; --soft:#EAF4EE; --line:rgba(47,93,74,.11); --line-2:rgba(47,93,74,.2);
  --ink:#16261E; --ink2:#5C7068; --ink3:#93A39A;
  --sage:#7FB89A; --mint:#A8D5BA; --deep:#2F5D4A; --accent-ink:#2F5D4A; --on-sage:#12301F;
  --today:#2F5D4A; --on-today:#FFFFFF;
  --maxym:#2F7D5B; --on-maxym:#FFFFFF; --sasha:#9CCB7C; --on-sasha:#1E3A22;
  --warn:#F0B27A; --bad:#E58C8C; --bad-ink:#A04545;
  --glass:rgba(231,241,234,.84); --sheet:rgba(255,255,255,.9); --backdrop:rgba(18,32,26,.4);
  --toast-bg:rgba(31,61,48,.95); --toast-ink:#FFFFFF;
  --shadow:0 1px 1px rgba(28,58,45,.04),0 10px 30px rgba(28,58,45,.08);
  --shadow-up:0 -12px 44px rgba(20,45,35,.2);
  --rc:24px; --tabh:62px; --ease:cubic-bezier(.22,.8,.24,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
}
:root[data-bg="blanc"]{--bg:#F5F7F6;--bg-hi:#FFFFFF;--glass:rgba(245,247,246,.82)}
:root[data-bg="menthe"]{--bg:#E7F1EA;--bg-hi:#F4F9F6;--glass:rgba(231,241,234,.84)}
:root[data-bg="sauge"]{--bg:#CBE4D5;--bg-hi:#DDEFE4;--glass:rgba(208,230,218,.82)}
:root[data-bg="creme"]{--bg:#F3EFE5;--bg-hi:#FBF8F1;--glass:rgba(243,239,229,.84)}
:root[data-bg="ardoise"]{--bg:#E8EDF1;--bg-hi:#F5F8FA;--glass:rgba(232,237,241,.84)}
:root[data-bg="ciel"]{--bg:#E3EEF9;--bg-hi:#F5F9FC;--glass:rgba(227,238,249,.84)}
:root[data-bg="ocean"]{--bg:#D8ECEF;--bg-hi:#F5FBFC;--glass:rgba(216,236,239,.84)}
:root[data-bg="lavande"]{--bg:#ECE8F7;--bg-hi:#F7F5FC;--glass:rgba(236,232,247,.84)}
:root[data-bg="rose"]{--bg:#F8E8EE;--bg-hi:#FCF5F8;--glass:rgba(248,232,238,.84)}
:root[data-bg="peche"]{--bg:#FBEBDD;--bg-hi:#FCF8F5;--glass:rgba(251,235,221,.84)}
:root[data-bg="sable"]{--bg:#EFE6D4;--bg-hi:#FCFAF5;--glass:rgba(239,230,212,.84)}
:root[data-bg="citron"]{--bg:#F3F1CF;--bg-hi:#FCFCF5;--glass:rgba(243,241,207,.84)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A15; --bg-hi:#17291F; --card:#1A2A23; --soft:#22372D; --line:rgba(168,213,186,.1); --line-2:rgba(168,213,186,.2);
  --ink:#EAF3EE; --ink2:#9DB2A7; --ink3:#6F867A; --accent-ink:#A8D5BA; --today:#A8D5BA; --on-today:#0F1A15;
  --maxym:#4FB588; --on-maxym:#07210F; --sasha:#B6DC98; --on-sasha:#18301B; --bad-ink:#F0A5A5;
  --glass:rgba(15,26,21,.78); --sheet:rgba(26,42,35,.92); --backdrop:rgba(0,0,0,.55);
  --toast-bg:rgba(234,243,238,.96); --toast-ink:#0F1A15;
  --shadow:0 1px 1px rgba(0,0,0,.2),0 10px 30px rgba(0,0,0,.28); --shadow-up:0 -12px 44px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A15; --bg-hi:#17291F; --card:#1A2A23; --soft:#22372D; --line:rgba(168,213,186,.1); --line-2:rgba(168,213,186,.2);
  --ink:#EAF3EE; --ink2:#9DB2A7; --ink3:#6F867A; --accent-ink:#A8D5BA; --today:#A8D5BA; --on-today:#0F1A15;
  --maxym:#4FB588; --on-maxym:#07210F; --sasha:#B6DC98; --on-sasha:#18301B; --bad-ink:#F0A5A5;
  --glass:rgba(15,26,21,.78); --sheet:rgba(26,42,35,.92); --backdrop:rgba(0,0,0,.55);
  --toast-bg:rgba(234,243,238,.96); --toast-ink:#0F1A15;
  --shadow:0 1px 1px rgba(0,0,0,.2),0 10px 30px rgba(0,0,0,.28); --shadow-up:0 -12px 44px rgba(0,0,0,.5);
  color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-bg="ciel"]{--bg:#0F1317;--bg-hi:#171E24;--card:#1C2329;--soft:#263039;--glass:rgba(15,19,23,.78);--sheet:rgba(28,35,41,.92)}}
:root[data-theme="dark"][data-bg="ciel"]{--bg:#0F1317;--bg-hi:#171E24;--card:#1C2329;--soft:#263039;--glass:rgba(15,19,23,.78);--sheet:rgba(28,35,41,.92)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-bg="ocean"]{--bg:#0F1617;--bg-hi:#172224;--card:#1C2829;--soft:#263639;--glass:rgba(15,22,23,.78);--sheet:rgba(28,40,41,.92)}}
:root[data-theme="dark"][data-bg="ocean"]{--bg:#0F1617;--bg-hi:#172224;--card:#1C2829;--soft:#263639;--glass:rgba(15,22,23,.78);--sheet:rgba(28,40,41,.92)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-bg="lavande"]{--bg:#120F17;--bg-hi:#1B1724;--card:#201C29;--soft:#2C2639;--glass:rgba(18,15,23,.78);--sheet:rgba(32,28,41,.92)}}
:root[data-theme="dark"][data-bg="lavande"]{--bg:#120F17;--bg-hi:#1B1724;--card:#201C29;--soft:#2C2639;--glass:rgba(18,15,23,.78);--sheet:rgba(32,28,41,.92)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-bg="rose"]{--bg:#170F12;--bg-hi:#24171C;--card:#291C20;--soft:#39262D;--glass:rgba(23,15,18,.78);--sheet:rgba(41,28,32,.92)}}
:root[data-theme="dark"][data-bg="rose"]{--bg:#170F12;--bg-hi:#24171C;--card:#291C20;--soft:#39262D;--glass:rgba(23,15,18,.78);--sheet:rgba(41,28,32,.92)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-bg="peche"]{--bg:#17120F;--bg-hi:#241C17;--card:#29211C;--soft:#392E26;--glass:rgba(23,18,15,.78);--sheet:rgba(41,33,28,.92)}}
:root[data-theme="dark"][data-bg="peche"]{--bg:#17120F;--bg-hi:#241C17;--card:#29211C;--soft:#392E26;--glass:rgba(23,18,15,.78);--sheet:rgba(41,33,28,.92)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-bg="sable"]{--bg:#17140F;--bg-hi:#241F17;--card:#29251C;--soft:#393226;--glass:rgba(23,20,15,.78);--sheet:rgba(41,37,28,.92)}}
:root[data-theme="dark"][data-bg="sable"]{--bg:#17140F;--bg-hi:#241F17;--card:#29251C;--soft:#393226;--glass:rgba(23,20,15,.78);--sheet:rgba(41,37,28,.92)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-bg="citron"]{--bg:#17170F;--bg-hi:#242317;--card:#29291C;--soft:#393826;--glass:rgba(23,23,15,.78);--sheet:rgba(41,41,28,.92)}}
:root[data-theme="dark"][data-bg="citron"]{--bg:#17170F;--bg-hi:#242317;--card:#29291C;--soft:#393826;--glass:rgba(23,23,15,.78);--sheet:rgba(41,41,28,.92)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-bg="sauge"]{--bg:#0F1712;--bg-hi:#17241C;--card:#1C2921;--soft:#26392D;--glass:rgba(15,23,18,.78);--sheet:rgba(28,41,33,.92)}}
:root[data-theme="dark"][data-bg="sauge"]{--bg:#0F1712;--bg-hi:#17241C;--card:#1C2921;--soft:#26392D;--glass:rgba(15,23,18,.78);--sheet:rgba(28,41,33,.92)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--bg-hi) 0,var(--bg) 380px),var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:active:not(:disabled){transform:scale(.97)}
button,.ib,.chip,.btn{transition:transform .12s var(--ease),background .2s,box-shadow .2s,opacity .2s}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--sage) 70%,transparent);outline-offset:2px;border-radius:12px}
h1,h2,h3,p{margin:0}
.i{display:block;flex:none}
[hidden]{display:none!important}

/* ---------- coque ---------- */
#app{height:100%;display:flex;flex-direction:column;position:relative}
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.page{width:100%;max-width:880px;margin:0 auto;padding:0 16px calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 104px)}
.hdr{position:sticky;top:0;z-index:6;margin:0 -16px;padding:14px 16px 10px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5)}
.hrow{display:flex;align-items:center;gap:10px}
.title{font-size:31px;font-weight:800;letter-spacing:-.025em;line-height:1.1;flex:1;min-width:0;text-wrap:balance}
.sub{color:var(--ink2);font-size:14px;margin-top:2px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);color:var(--accent-ink);flex:none}
.ib.flat{background:transparent;box-shadow:none}
.me-btn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;position:relative}
.me-btn .sd{position:absolute;right:2px;bottom:2px;width:11px;height:11px;border-radius:50%;background:var(--mint);border:2px solid var(--bg)}
.me-btn .sd.off{background:var(--warn)}
.content{padding-top:6px}
.navrow{display:flex;align-items:center;gap:8px;margin-top:10px}
.navt{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;line-height:1.15}
.navt b{font-size:19px;font-weight:700;letter-spacing:-.01em}
.navt span{font-size:13px;color:var(--ink2)}
.hdr .seg{margin-top:10px}

#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border-radius:16px;color:var(--ink3);font-size:11px;font-weight:600}
.tab.on{color:var(--accent-ink)}
.tab.on .tic{background:color-mix(in srgb,var(--sage) 30%,transparent)}
.tic{width:54px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .25s}
.tic svg{width:24px;height:24px}
.brand{display:none}

#fab{position:fixed;right:18px;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 16px);width:58px;height:58px;border-radius:50%;background:var(--sage);color:var(--on-sage);box-shadow:0 10px 26px rgba(47,93,74,.38);display:grid;place-items:center;z-index:20;transition:transform .22s var(--ease),opacity .2s}
#fab.hide{transform:scale(.5);opacity:0;pointer-events:none}
#fab svg{width:28px;height:28px;stroke-width:2.2}

@media (min-width:920px){
  #app{flex-direction:row}
  #tabbar{position:static;display:flex;flex-direction:column;gap:6px;width:236px;flex:none;height:100%;padding:30px 14px;border-top:0;border-right:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;letter-spacing:-.02em;padding:0 12px 22px;color:var(--accent-ink)}
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;min-height:48px;padding:0 12px;font-size:16px}
  .tab.on{background:color-mix(in srgb,var(--sage) 26%,transparent)}
  .tab.on .tic{background:transparent}
  .tic{width:28px;height:28px}
  .page{padding-bottom:120px}
  #fab{right:36px;bottom:36px}
}

/* ---------- briques ---------- */
.card{background:var(--card);border-radius:var(--rc);box-shadow:var(--shadow);padding:18px;margin-top:14px}
.card.tint{background:var(--soft);box-shadow:none}
.card h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.card h3 button.lk{text-transform:none;letter-spacing:0;font-size:14px;color:var(--accent-ink);font-weight:600;min-height:32px}
.grid2{display:grid;gap:0 14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.mut{color:var(--ink2)}
.sm{font-size:13px}
.amount{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.amtc{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}.owe{font-size:11.5px;font-weight:600;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
#ex-owe{margin:8px 0 0;font-size:13.5px;font-weight:650;color:var(--ink)}
.big{font-size:34px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.1}
.av{width:var(--s,28px);height:var(--s,28px);border-radius:50%;background:var(--c);color:var(--o);display:inline-grid;place-items:center;font-weight:800;font-size:calc(var(--s,28px) * .45);flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:13px;background:var(--soft);color:var(--accent-ink);font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.warn{background:color-mix(in srgb,var(--warn) 30%,var(--card));color:#8A5420}
.pill.bad{background:color-mix(in srgb,var(--bad) 28%,var(--card));color:var(--bad-ink)}
.pill.ok{background:color-mix(in srgb,var(--mint) 45%,var(--card))}
.btn{min-height:50px;border-radius:16px;padding:0 20px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn-p{background:var(--sage);color:var(--on-sage)}
.btn-s{background:var(--soft);color:var(--accent-ink)}
.btn-d{background:color-mix(in srgb,var(--bad) 22%,var(--card));color:var(--bad-ink)}
.btn-g{color:var(--accent-ink);min-height:44px}
.btn-b{width:100%}
.btn-sm{min-height:44px;padding:0 16px;font-size:15px;border-radius:14px}
.btns{display:grid;gap:10px;margin-top:20px}
.btns.two{grid-template-columns:1fr 1fr}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:22px;background:var(--soft);font-weight:600;font-size:15px;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--sage);color:var(--on-sage)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.seg{display:flex;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:13px;padding:3px;gap:2px}
.seg button{flex:1;min-height:42px;border-radius:10px;font-size:14.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;min-width:0;padding:0 6px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.13)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:18px 0 8px}
.inp{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--card);padding:0 14px;font-size:16px;appearance:none;-webkit-appearance:none}
textarea.inp{padding:12px 14px;min-height:84px;resize:vertical}
.inp:focus{outline:0;border-color:var(--sage);box-shadow:0 0 0 4px color-mix(in srgb,var(--sage) 25%,transparent)}
.amt{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:8px 0 2px}
.amt input{font-size:46px;font-weight:800;letter-spacing:-.025em;text-align:center;border:0;background:transparent;width:70%;min-width:0;padding:0;font-variant-numeric:tabular-nums}
.amt input:focus{outline:0}
.amt span{font-size:30px;font-weight:700;color:var(--ink3)}
.swr{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;font-weight:600}
.sw{width:51px;height:31px;border-radius:16px;background:var(--line-2);position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .25s var(--ease)}
.sw.on{background:var(--sage)}
.sw.on::after{transform:translateX(20px)}
.li{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 0;border-top:1px solid var(--line);width:100%}
.li:first-child{border-top:0}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:color-mix(in srgb,var(--pc,var(--sage)) 26%,var(--card));flex:none}
.ic.sm{width:34px;height:34px;border-radius:11px;font-size:17px}
.empty{text-align:center;padding:26px 12px;color:var(--ink2)}
.empty .eic{width:64px;height:64px;border-radius:22px;background:var(--soft);display:grid;place-items:center;margin:0 auto 12px;color:var(--accent-ink)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--warn) 24%,var(--card));font-size:14px;margin-top:14px}
.note.info{background:var(--soft)}
.note .grow b{display:block}
.sk{background:linear-gradient(90deg,var(--soft),color-mix(in srgb,var(--soft) 45%,var(--card)),var(--soft));background-size:200% 100%;animation:shimmer 1.3s linear infinite;border-radius:20px}
@keyframes shimmer{to{background-position:-200% 0}}

/* ---------- feuilles modales ---------- */
#sheetRoot{position:fixed;inset:0;z-index:50;display:none}
#sheetRoot.open{display:block}
.backdrop{position:absolute;inset:0;background:var(--backdrop);opacity:0;transition:opacity .3s var(--ease);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#sheetRoot.show .backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;display:flex;flex-direction:column;background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);border-radius:28px 28px 0 0;box-shadow:var(--shadow-up);transform:translateY(100%);transition:transform .34s var(--ease)}
#sheetRoot.show .sheet{transform:none}
.sheet.drag{transition:none}
.grab{height:30px;display:grid;place-items:center;flex:none;touch-action:none}
.grab i{width:40px;height:5px;border-radius:3px;background:var(--line-2)}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:0 20px calc(24px + env(safe-area-inset-bottom,0px))}
.st{font-size:23px;font-weight:800;letter-spacing:-.015em;text-wrap:balance}
.ss{color:var(--ink2);font-size:14px;margin-top:2px}
@media (min-width:760px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(540px,92vw);max-height:88%;border-radius:28px;transform:translate(-50%,-46%) scale(.96);opacity:0;transition:transform .3s var(--ease),opacity .25s}
  #sheetRoot.show .sheet{transform:translate(-50%,-50%);opacity:1}
  .grab{height:18px}
}

/* ---------- toasts ---------- */
#toastRoot{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 82px);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none;padding:0 16px}
.toast{display:flex;align-items:center;gap:9px;max-width:min(440px,100%);padding:12px 18px;border-radius:22px;background:var(--toast-bg);color:var(--toast-ink);font-size:15px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:fade .32s var(--ease)}
.toast.err{background:#B24A4A;color:#fff}
.toast.out{opacity:0;transform:translateY(8px);transition:all .28s}
.toast svg{width:20px;height:20px;stroke:var(--mint);stroke-width:3;fill:none;stroke-dasharray:26;stroke-dashoffset:26;animation:draw .45s .1s forwards;flex:none}
@keyframes draw{to{stroke-dashoffset:0}}
@media (min-width:920px){#toastRoot{bottom:32px}}

/* ---------- profil au premier lancement ---------- */
#gate{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;overflow-y:auto}
#gate.on{display:block}
.gate{max-width:420px;margin:0 auto;padding:max(8vh,40px) 24px 40px;text-align:center}
.gate-logo{width:72px;height:72px;border-radius:24px;background:var(--sage);color:var(--on-sage);display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 14px 34px rgba(47,93,74,.3)}
.gate h1{font-size:36px;font-weight:800;letter-spacing:-.03em}
.gate p{color:var(--ink2);margin-top:6px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.whoc{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:22px 10px;display:flex;flex-direction:column;align-items:center;gap:12px;font-size:19px;font-weight:700;min-height:160px;justify-content:center}
.fine{font-size:13px;margin-top:22px}

/* ---------- accueil ---------- */
.tdp{display:grid;grid-template-columns:34px repeat(3,minmax(0,1fr));gap:6px;align-items:center;margin-top:8px}
.tc{border-radius:14px;padding:7px 4px;text-align:center;font-size:11.5px;color:var(--ink2);font-weight:600;background:color-mix(in srgb,var(--pc,var(--ink3)) 22%,var(--card));min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.15}
.tc b{font-size:19px;font-weight:400}
.tc.tg{box-shadow:inset 0 0 0 2px var(--mint)}
.tc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.meals2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.m2{background:var(--soft);border-radius:14px;padding:10px 12px;min-width:0}
.m2 small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.m2 b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.sd1{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 2px;border-radius:14px;min-height:76px;font-size:12px;color:var(--ink2);font-weight:700}
.sd1 b{font-size:15px;color:var(--ink);width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.sd1.today b{background:var(--today);color:var(--on-today)}
.sd1.we{background:color-mix(in srgb,var(--soft) 80%,transparent)}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.qa button{background:var(--card);border-radius:20px;box-shadow:var(--shadow);min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px;color:var(--accent-ink);text-align:center;padding:8px 4px}
.qa .qi{width:34px;height:34px;border-radius:12px;background:var(--soft);display:grid;place-items:center}
.sync-note{font-size:13px;color:var(--ink2);text-align:center;margin-top:18px}

/* ---------- planning ---------- */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.mh{text-align:center;font-size:12px;font-weight:700;color:var(--ink3);padding:6px 0}
.mc{min-height:66px;border-radius:14px;background:var(--card);padding:6px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 1px 2px rgba(28,58,45,.06);position:relative}
.mc.out{opacity:.4}
.mc.we{background:color-mix(in srgb,var(--soft) 75%,var(--card))}
.mc.tg::after{content:"";position:absolute;inset:0;border-radius:14px;box-shadow:inset 0 0 0 2px var(--mint);pointer-events:none}
.mc .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700}
.mc.today .n{background:var(--today);color:var(--on-today)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:100%;padding:0 3px}
.mini i{height:5px;border-radius:3px;background:var(--pc,var(--line-2))}
.dots{display:flex;gap:3px;height:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--c)}
.wk{display:grid;grid-template-columns:36px repeat(7,minmax(0,1fr));gap:4px;align-items:stretch}
.dh{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;border-radius:14px;padding:5px 0;font-size:12px;font-weight:700;color:var(--ink2)}
.dh b{font-size:17px;color:var(--ink);width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.dh.today b{background:var(--today);color:var(--on-today)}
.dh.we,.c3.we{background:color-mix(in srgb,var(--soft) 85%,transparent)}
.dh .dd{display:flex;gap:3px;height:5px}
.pl{display:flex;align-items:center;justify-content:center}
.c3{display:flex;flex-direction:column;gap:3px;border-radius:14px;padding:3px}
.sl{height:44px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--pc,var(--ink)) 28%,var(--card));position:relative;width:100%}
.sl.empty{background:var(--card);color:var(--ink3);font-size:18px;box-shadow:inset 0 0 0 1px var(--line)}
.sl.tg{box-shadow:inset 0 0 0 2.5px var(--mint),0 0 0 2px color-mix(in srgb,var(--mint) 30%,transparent)}
.sl .rp{position:absolute;right:2px;top:2px;opacity:.55}
.sp6{grid-column:1/-1;height:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--ink2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--pc)}
.wkrow{display:flex;align-items:center;gap:10px;margin-top:14px}
.evrow{display:flex;gap:12px;align-items:center;min-height:56px;width:100%;padding:8px 0;border-top:1px solid var(--line)}
.evrow:first-child{border-top:0}
.evd{width:46px;text-align:center;flex:none;line-height:1.1}
.evd small{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.evd b{font-size:20px}
.pres{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.presc{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:12px}
.presc .ph{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px}
.pb{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;border-radius:12px;padding:0 8px;margin-top:4px;background:color-mix(in srgb,var(--pc,var(--ink3)) 20%,var(--card));min-width:0}
.pb.tg{box-shadow:inset 0 0 0 2px var(--mint)}
.pb small{font-size:11px;font-weight:700;color:var(--ink2);width:34px;flex:none;line-height:1.1}
.pb b{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pb span.e{font-size:18px}
.tl{position:relative;padding-left:60px}
.tl::before{content:"";position:absolute;left:46px;top:8px;bottom:8px;width:2px;background:var(--line-2);border-radius:2px}
.tr{position:relative;padding:4px 0 12px}
.tr .tm{position:absolute;left:-60px;width:36px;text-align:right;font-size:13px;font-weight:700;color:var(--ink2);top:14px;font-variant-numeric:tabular-nums;line-height:1}
.tr::before{content:"";position:absolute;left:-18px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2.5px solid var(--sage)}
.evc{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:16px;padding:11px 12px;box-shadow:var(--shadow);width:100%;min-width:0}
.evc .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evc .s{font-size:13px;color:var(--ink2)}
.avs{display:flex}
.avs .av{margin-left:-8px;border:2px solid var(--card)}
.avs .av:first-child{margin-left:0}
.wehl{background:linear-gradient(135deg,color-mix(in srgb,var(--mint) 55%,var(--card)),color-mix(in srgb,var(--sage) 30%,var(--card)));border-radius:20px;min-height:56px;width:100%;display:flex;align-items:center;gap:12px;padding:0 16px;font-weight:700;color:var(--accent-ink);margin-top:14px}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pgrid button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:78px;border-radius:18px;background:color-mix(in srgb,var(--pc) 24%,var(--card));font-size:12px;font-weight:700;text-align:center;padding:6px 2px;min-width:0}
.pgrid button b{font-size:26px;font-weight:400;line-height:1}
.pgrid button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emojis button{aspect-ratio:1;border-radius:12px;font-size:22px;display:grid;place-items:center;min-height:40px}
.emojis button.on{background:var(--sage)}
.emp-top{display:flex;align-items:center;gap:10px}.emp-cur{width:52px;height:52px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:30px;flex:none}
.emp-tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:10px 0 6px}.emp-tabs::-webkit-scrollbar{display:none}
.emp-tabs button{flex:none;width:40px;height:38px;border-radius:11px;font-size:19px;display:grid;place-items:center;opacity:.6}.emp-tabs button.on{background:var(--sage);opacity:1}
.emp-grid{max-height:216px;overflow-y:auto;overscroll-behavior:contain;grid-template-columns:repeat(7,1fr)}
.sw-col{display:flex;flex-wrap:wrap;gap:10px}
.sw-col button{width:40px;height:40px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px rgba(0,0,0,.06)}
.sw-col button.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--accent-ink)}

/* ---------- repas ---------- */
.mg{display:grid;grid-template-columns:46px minmax(0,1fr) minmax(0,1fr);gap:6px}
.mgh{text-align:center;font-size:12px;font-weight:700;color:var(--ink3);padding:4px 0;letter-spacing:.05em;text-transform:uppercase}
.md{min-height:66px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink2)}
.md b{font-size:19px;color:var(--ink);width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.md.today b{background:var(--today);color:var(--on-today)}
.md.we{background:color-mix(in srgb,var(--soft) 85%,transparent)}
.mcell{min-height:66px;border-radius:14px;background:var(--card);padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:3px;box-shadow:0 1px 2px rgba(28,58,45,.06);min-width:0;text-align:left}
.mcell .nm{font-weight:600;font-size:14px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.mcell .mt{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.mcell.emp{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2);color:var(--ink3);align-items:center}
.dragover{outline:2.5px dashed var(--sage);outline-offset:-2px}
.mealwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.rpanel{display:none}
@media (min-width:1040px){.mealwrap{grid-template-columns:minmax(0,1fr) 270px}.rpanel{display:block}}
.rcard{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--soft);margin-top:8px;cursor:grab;min-height:48px}
.rcard b{font-size:14px}
.rrow{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow .main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:62px;padding:6px 0}
.hb{width:44px;height:44px;display:grid;place-items:center;color:var(--ink3);border-radius:50%}
.hb.on{color:#E07A8A}
.hb.on svg{fill:currentColor}
.shop{display:flex;align-items:center;gap:12px;min-height:54px;width:100%;border-top:1px solid var(--line);padding:6px 0}
.shop:first-of-type{border-top:0}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s}
.ck svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .28s .04s}
.shop.done .ck{background:var(--sage);border-color:var(--sage)}
.shop.done .ck svg{stroke-dashoffset:0;stroke:var(--on-sage)}
.shop .t{font-weight:600;transition:color .2s}
.shop.done .t{text-decoration:line-through;color:var(--ink3)}
.shop .q{margin-left:auto;font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.aisle{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:16px 0 2px}
.addrow{display:flex;gap:8px}
.addrow .inp{flex:1}
.prog{height:8px;border-radius:5px;background:color-mix(in srgb,var(--ink) 8%,transparent);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;border-radius:5px;background:var(--sage);transition:width .5s var(--ease)}

/* ---------- budget ---------- */
.bal{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bal .grow{min-width:170px}
.donutw{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.donut{width:152px;height:152px;flex:none}
.leg{display:grid;gap:7px;flex:1;min-width:170px}
.legi{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.legi i{width:10px;height:10px;border-radius:50%;flex:none}
.legi .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg{height:10px;border-radius:6px;background:color-mix(in srgb,var(--ink) 8%,transparent);overflow:hidden;margin-top:8px}
.pg>i{display:block;height:100%;border-radius:6px;transition:width .6s var(--ease),background .3s}
.tgt{display:block;width:100%;padding:10px 0;border-top:1px solid var(--line);min-height:56px}
.tgt:first-of-type{border-top:0}
.bars{display:flex;align-items:flex-end;gap:8px;height:116px}
.bars button{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;min-width:0;text-align:center}
.bars i{display:block;width:100%;max-width:38px;border-radius:9px 9px 4px 4px;background:var(--mint);transition:height .45s var(--ease);min-height:4px}
.bars .on i{background:var(--sage)}
.bars span{font-size:11px;color:var(--ink2);font-weight:700}
.calc{display:grid;gap:8px;font-size:15px}
.calc .r{display:flex;justify-content:space-between;gap:10px}
.calc .r.t{font-weight:800;border-top:1.5px dashed var(--line-2);padding-top:8px;margin-top:2px}
.calc .r.sub{color:var(--accent-ink);font-weight:700}
.dayh{font-size:13px;font-weight:700;color:var(--ink2);margin:16px 0 2px;display:flex;justify-content:space-between}
.fbar{display:grid;gap:8px;margin-top:10px}
.sbox{position:relative}
.sbox svg{position:absolute;left:14px;top:14px;color:var(--ink3);pointer-events:none}
.sbox .inp{padding-left:44px}
.range{width:100%;accent-color:var(--sage);height:36px}
.goal{padding:14px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0}
.eye{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:600;color:var(--accent-ink);font-size:14px}

/* ---------- animations de navigation ---------- */
@keyframes zin{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:none}}
@keyframes zout{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
@keyframes slL{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes slR{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.a-zin{animation:zin .32s var(--ease)}
.a-zout{animation:zout .32s var(--ease)}
.a-slL{animation:slL .3s var(--ease)}
.a-slR{animation:slR .3s var(--ease)}
.a-fade{animation:fade .3s var(--ease)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.inp{min-width:0}
.pgrid button.on{outline:2.5px solid var(--sage);outline-offset:-2.5px}
.pgrid button span{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.15}
.seg.s4{grid-template-columns:repeat(4,1fr)}
.inl{display:inline-flex;align-items:center;gap:6px}
.tap{min-height:44px;min-width:44px}
.mc.sel{background:color-mix(in srgb,var(--sage) 30%,var(--card))}
.mc.sel .n{background:var(--sage);color:var(--on-sage)}
.dh.sel{background:color-mix(in srgb,var(--sage) 30%,var(--card));border-radius:14px}
.selcard{background:color-mix(in srgb,var(--mint) 70%,var(--card))}
.btn[disabled]{opacity:.45;pointer-events:none}
.lvrow{display:flex;align-items:center;gap:10px}.lvrow .seg{flex:1;min-width:0}.lvrow .chip,.lvrow .ib{flex:none}
.toast.undo{pointer-events:auto}
.tundo{margin-left:6px;padding:6px 10px;border-radius:12px;font-weight:800;color:var(--mint);min-height:32px}
.chk{width:36px;height:36px;border-radius:50%;border:2px solid var(--line-2);color:transparent;display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s,color .2s,transform .15s}
.chk:active{background:var(--sage);border-color:var(--sage);color:var(--on-sage);transform:scale(.9)}
.chk.late{border-color:var(--warn)}
.wkrow{flex-wrap:wrap}
#selbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 10px);z-index:45;display:none;justify-content:center;padding:0 12px;pointer-events:none}
#selbar.on{display:flex}
.selbar-in{pointer-events:auto;display:flex;align-items:center;gap:10px;width:100%;max-width:540px;padding:10px;border-radius:28px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 12px 36px rgba(20,50,38,.22);border:1px solid var(--line);animation:fade .25s var(--ease)}
.selbar-t{flex:1;min-width:0;display:flex;flex-direction:column;text-align:center;line-height:1.2}
.selbar-t b{font-size:16px}.selbar-t span{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selbar-in .btn{min-height:46px;padding:0 16px;flex:none}
body.selmode #fab{display:none}
body.selmode .page{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 130px)}
.selm{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.month.selm{grid-template-columns:30px repeat(7,minmax(0,1fr))}
.mw,.mh[data-act]{border-radius:10px;font-size:12px;font-weight:700;color:var(--accent-ink);background:color-mix(in srgb,var(--mint) 55%,transparent);display:grid;place-items:center;min-height:30px}
.mw{min-height:66px;font-size:11px}
.mh[data-act]{min-height:34px}
.mc.sel,.dh.sel{box-shadow:inset 0 0 0 2.5px var(--sage)}
@media (min-width:920px){#selbar{left:236px;bottom:22px}}
.selcard{padding:12px 14px}
.selcard .chip{padding:0 13px;min-height:38px;font-size:14px}
.selcard .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
/* ---------- densité & confort (inspiré Notion / Apple) ---------- */
.hdr{padding:10px 16px 8px;transition:box-shadow .2s}
.title{font-size:30px;transition:font-size .2s var(--ease)}
.title .sub{transition:opacity .15s,max-height .2s;max-height:24px;overflow:hidden}
